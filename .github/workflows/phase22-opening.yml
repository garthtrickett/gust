name: Cranelift Phase 22 Opening

on:
  pull_request:
    paths:
      - 'TASK.md'
      - 'reset-heavy-guards-workflow.sh'
      - 'Makefile'
      - 'README.md'
      - 'gust_v4.c'
      - 'compiler/*.gst'
      - 'tests/*.gst'
      - 'compiler/CRANELIFT_PHASE22_OPENING.md'
      - 'compiler/experiments/cranelift/**'
      - 'docs/ONE_WAY_LEDGER.md'
      - 'docs/ROADMAP_TAIL.md'
      - 'src/runtime.c'
      - 'src/runtime/**'
      - 'tools/normalize_generated_arena_offsets.py'
      - 'scripts/*.sh'
      - 'scripts/cranelift_feature_registry.json'
      - 'scripts/cranelift_feature_registry.schema.json'
      - 'scripts/cranelift_registry.py'
      - 'scripts/cranelift_test_levels.json'
      - 'scripts/phase21_closure.py'
      - 'scripts/phase22_opening.py'
      - '.github/workflows/cranelift-historical-full.yml'
      - '.github/workflows/heavy-guards.yml'
      - '.github/workflows/phase22-opening.yml'
      - '.github/workflows/pr-fast.yml'
      - 'justfile*'
  push:
    branches: [main]
    paths:
      - 'TASK.md'
      - 'reset-heavy-guards-workflow.sh'
      - 'Makefile'
      - 'README.md'
      - 'gust_v4.c'
      - 'compiler/*.gst'
      - 'tests/*.gst'
      - 'compiler/CRANELIFT_PHASE22_OPENING.md'
      - 'compiler/experiments/cranelift/**'
      - 'docs/ONE_WAY_LEDGER.md'
      - 'docs/ROADMAP_TAIL.md'
      - 'src/runtime.c'
      - 'src/runtime/**'
      - 'tools/normalize_generated_arena_offsets.py'
      - 'scripts/*.sh'
      - 'scripts/cranelift_feature_registry.json'
      - 'scripts/cranelift_feature_registry.schema.json'
      - 'scripts/cranelift_registry.py'
      - 'scripts/cranelift_test_levels.json'
      - 'scripts/phase21_closure.py'
      - 'scripts/phase22_opening.py'
      - '.github/workflows/cranelift-historical-full.yml'
      - '.github/workflows/heavy-guards.yml'
      - '.github/workflows/phase22-opening.yml'
      - '.github/workflows/pr-fast.yml'
      - 'justfile*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/install-native-deps-ci.sh build-essential curl ripgrep
      - run: bash scripts/install-just-ci.sh "$HOME/.local/bin" && echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: guard-cranelift-phase22-opening-contract
        run: just guard-cranelift-phase22-opening-contract

  evidence:
    needs: contract
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/install-native-deps-ci.sh build-essential curl ripgrep
      - run: bash scripts/install-just-ci.sh "$HOME/.local/bin" && echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - run: make phase10-native-package
      - name: guard-cranelift-phase22-opening-evidence
        run: just guard-cranelift-phase22-opening-evidence
