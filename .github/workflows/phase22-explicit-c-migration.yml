name: Cranelift Phase 22 Explicit C Migration

on:
  pull_request:
    paths:
      - 'TASK.md'
      - 'Makefile'
      - 'gust_v4.c'
      - 'compiler/*.gst'
      - 'tests/*.gst'
      - 'reset-heavy-guards-workflow.sh'
      - 'compiler/CRANELIFT_PHASE22_OPENING.md'
      - 'compiler/CRANELIFT_PHASE22_EXPLICIT_C_MIGRATION.md'
      - 'scripts/*.py'
      - 'scripts/*.sh'
      - 'scripts/cranelift_feature_registry.json'
      - 'scripts/cranelift_feature_registry.schema.json'
      - 'scripts/cranelift_registry.py'
      - 'scripts/cranelift_test_levels.json'
      - '.github/workflows/phase22-opening.yml'
      - '.github/workflows/phase22-explicit-c-migration.yml'
      - '.github/workflows/pr-fast.yml'
      - 'justfile*'
  push:
    branches: [main]
    paths:
      - 'TASK.md'
      - 'Makefile'
      - 'gust_v4.c'
      - 'compiler/*.gst'
      - 'tests/*.gst'
      - 'reset-heavy-guards-workflow.sh'
      - 'compiler/CRANELIFT_PHASE22_OPENING.md'
      - 'compiler/CRANELIFT_PHASE22_EXPLICIT_C_MIGRATION.md'
      - 'scripts/*.py'
      - 'scripts/*.sh'
      - 'scripts/cranelift_feature_registry.json'
      - 'scripts/cranelift_feature_registry.schema.json'
      - 'scripts/cranelift_registry.py'
      - 'scripts/cranelift_test_levels.json'
      - '.github/workflows/phase22-opening.yml'
      - '.github/workflows/phase22-explicit-c-migration.yml'
      - '.github/workflows/pr-fast.yml'
      - 'justfile*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/install-native-deps-ci.sh build-essential curl ripgrep
      - run: bash scripts/install-just-ci.sh "$HOME/.local/bin" && echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: guard-cranelift-phase22-explicit-c-migration-contract
        run: just guard-cranelift-phase22-explicit-c-migration-contract

  evidence:
    needs: contract
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/install-native-deps-ci.sh build-essential curl ripgrep
      - run: bash scripts/install-just-ci.sh "$HOME/.local/bin" && echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - run: make gust
      - name: guard-cranelift-phase22-explicit-c-migration-evidence
        run: just guard-cranelift-phase22-explicit-c-migration-evidence
