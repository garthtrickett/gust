name: Cranelift Phase 17 Thread Runtime

on:
  pull_request:
    paths:
      - 'compiler/mir_runtime_boundary_authority.gst'
      - 'compiler/mir_thread_runtime_request.gst'
      - 'compiler/mir_thread_runtime_smoke_test_entry.gst'
      - 'compiler/experiments/cranelift/src/thread_runtime.rs'
      - 'compiler/experiments/cranelift/src/main.rs'
      - 'compiler/mir_thread_runtime_request.gst'
      - 'scripts/cranelift_feature_registry.json'
      - 'scripts/cranelift_feature_registry.schema.json'
      - 'scripts/cranelift_registry.py'
      - 'scripts/phase17_thread_runtime.py'
      - 'scripts/phase17_thread_runtime_parity.sh'
      - 'scripts/guard-cranelift-phase17-thread-runtime-contract.sh'
      - 'tests/cranelift/phase17_thread_runtime_contract.tsv'
      - 'tests/cranelift/phase17_thread_runtime_review.txt'
      - '.github/workflows/phase17-thread-runtime.yml'
      - 'TASK.md'
  push:
    branches: [main]
    paths:
      - 'compiler/mir_runtime_boundary_authority.gst'
      - 'compiler/mir_thread_runtime_request.gst'
      - 'compiler/mir_thread_runtime_request.gst'
      - 'scripts/phase17_thread_runtime.py'
      - 'scripts/phase17_thread_runtime_parity.sh'
      - 'tests/cranelift/phase17_thread_runtime_contract.tsv'
      - 'tests/cranelift/phase17_thread_runtime_review.txt'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  guard-cranelift-phase17-thread-runtime-contract:
    name: Phase 17.12 thread runtime contract (Level 1)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/install-just-ci.sh "$HOME/.local/bin" && echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: guard-cranelift-phase17-thread-runtime-contract
        run: python3 scripts/phase17_thread_runtime.py --check

  guard-cranelift-phase17-thread-runtime-parity:
    name: Phase 17.12 thread runtime parity (Level 2)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/install-native-deps-ci.sh build-essential curl ripgrep binutils
      - name: Cache cargo registry and build outputs
        uses: actions/cache@v4
        with:
          # Only cargo target dirs and the registry. Never build/guards itself:
          # those dirs hold witnesses, mutation requests, and .output sentinels,
          # and restoring stale ones could manufacture a false pass.
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            compiler/experiments/cranelift/target
            src/runtime/gust
            build/guards/*/cargo-target
          key: cargo-${{ runner.os }}-${{ github.workflow }}-${{ hashFiles('compiler/experiments/cranelift/Cargo.lock') }}
          restore-keys: |
            cargo-${{ runner.os }}-${{ github.workflow }}-
      - run: bash scripts/install-just-ci.sh "$HOME/.local/bin" && echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: guard-cranelift-phase17-thread-runtime-parity
        run: just guard-cranelift-phase17-thread-runtime-parity
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase17-thread-runtime-diagnostics
          if-no-files-found: ignore
          path: |
            to.log
            build/gust-build.log
            build/guards/phase17_thread_runtime/
