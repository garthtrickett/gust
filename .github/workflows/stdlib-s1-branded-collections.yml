name: Stdlib S1 Branded Collections

on:
  pull_request:
    paths:
      - 'compiler/typechecker.gst'
      - 'compiler/codegen.gst'
      - 'src/runtime.c'
      - 'tests/stdlib_s1_branded_collections_*.gst'
      - 'tests/test_hashmap_reference_use_after_move_rejected.gst'
      - 'scripts/stdlib_s1_branded_collections_parity.sh'
      - 'justfile'
      - '.github/workflows/stdlib-s1-branded-collections.yml'
      - 'TASK_STDLIB.md'
  push:
    branches: [main]
    paths:
      - 'compiler/typechecker.gst'
      - 'compiler/codegen.gst'
      - 'src/runtime.c'
      - 'tests/stdlib_s1_branded_collections_*.gst'
      - 'tests/test_hashmap_reference_use_after_move_rejected.gst'
      - 'scripts/stdlib_s1_branded_collections_parity.sh'
      - 'justfile'
      - '.github/workflows/stdlib-s1-branded-collections.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  branded-collections:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/install-native-deps-ci.sh build-essential curl ripgrep
      - run: bash scripts/install-just-ci.sh "$HOME/.local/bin" && echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: guard-stdlib-s1-branded-collections
        run: just guard-stdlib-s1-branded-collections
