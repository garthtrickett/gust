name: Cranelift Phase 23 Same-Scope Declaration

on:
  pull_request:
    paths:
      - 'TASK.md'
      - 'GEMINI.md'
      - 'gust_v4.c'
      - 'compiler/typechecker.gst'
      - 'compiler/phase23_*scope*_current.gst'
      - 'compiler/phase23_assignment_reuse_current.gst'
      - 'compiler/phase23_different_function_reuse_current.gst'
      - 'compiler/CRANELIFT_PHASE23_SAME_SCOPE_DECLARATION.md'
      - 'docs/ISSUE_ROADMAP.md'
      - 'scripts/cranelift_feature_registry.json'
      - 'scripts/cranelift_feature_registry.schema.json'
      - 'scripts/cranelift_registry.py'
      - 'scripts/cranelift_test_levels.json'
      - 'scripts/phase23_same_scope_declaration.py'
      - 'scripts/phase23_same_scope_declaration_assurance.json'
      - 'justfile*'
      - '.github/workflows/phase23-same-scope-declaration.yml'
      - '.github/workflows/pr-fast.yml'
  push:
    branches: [main]
    paths:
      - 'TASK.md'
      - 'GEMINI.md'
      - 'gust_v4.c'
      - 'compiler/typechecker.gst'
      - 'compiler/phase23_*scope*_current.gst'
      - 'compiler/phase23_assignment_reuse_current.gst'
      - 'compiler/phase23_different_function_reuse_current.gst'
      - 'compiler/CRANELIFT_PHASE23_SAME_SCOPE_DECLARATION.md'
      - 'docs/ISSUE_ROADMAP.md'
      - 'scripts/cranelift_feature_registry.json'
      - 'scripts/cranelift_feature_registry.schema.json'
      - 'scripts/cranelift_registry.py'
      - 'scripts/cranelift_test_levels.json'
      - 'scripts/phase23_same_scope_declaration.py'
      - 'scripts/phase23_same_scope_declaration_assurance.json'
      - 'justfile*'
      - '.github/workflows/phase23-same-scope-declaration.yml'
      - '.github/workflows/pr-fast.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/install-native-deps-ci.sh build-essential curl ripgrep
      - run: bash scripts/install-just-ci.sh "$HOME/.local/bin" && echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: guard-cranelift-phase23-same-scope-declaration-contract
        run: just guard-cranelift-phase23-same-scope-declaration-contract

  evidence:
    needs: contract
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/install-native-deps-ci.sh build-essential curl ripgrep
      - run: bash scripts/install-just-ci.sh "$HOME/.local/bin" && echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: guard-cranelift-phase23-same-scope-declaration-evidence
        run: just guard-cranelift-phase23-same-scope-declaration-evidence
