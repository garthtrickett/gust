name: Cranelift Phase 21 Inert Scoped Query Records

on:
  pull_request:
    paths:
      - 'TASK.md'
      - 'compiler/typed_query_semantic_records.gst'
      - 'compiler/typed_query_semantic_records_test_entry.gst'
      - 'compiler/typed_query_semantic_records_forge_invalid.gst'
      - 'compiler/typed_query_semantic_records_private_constructor_invalid.gst'
      - 'compiler/phase21_query_shape_trusted_baseline.gst'
      - 'compiler/phase21_query_shape_untrusted_baseline.gst'
      - 'compiler/fixtures/phase21_query_shape_trusted_baseline.expected.c'
      - 'compiler/fixtures/phase21_query_shape_untrusted_baseline.expected.c'
      - 'compiler/phase20_resource_empty_forge_invalid.gst'
      - 'compiler/CRANELIFT_PHASE21_INERT_SCOPED_QUERY_RECORDS.md'
      - 'scripts/cranelift_feature_registry.json'
      - 'scripts/cranelift_feature_registry.schema.json'
      - 'scripts/cranelift_registry.py'
      - 'scripts/cranelift_test_levels.json'
      - 'scripts/phase21_inert_scoped_query_records.py'
      - 'scripts/phase21_inert_scoped_query_records.sh'
      - '.github/workflows/phase21-inert-scoped-query-records.yml'
      - '.github/workflows/pr-fast.yml'
      - 'justfile'
  push:
    branches: [main]
    paths:
      - 'TASK.md'
      - 'compiler/typed_query_semantic_records.gst'
      - 'compiler/typed_query_semantic_records_test_entry.gst'
      - 'compiler/typed_query_semantic_records_forge_invalid.gst'
      - 'compiler/typed_query_semantic_records_private_constructor_invalid.gst'
      - 'compiler/phase21_query_shape_trusted_baseline.gst'
      - 'compiler/phase21_query_shape_untrusted_baseline.gst'
      - 'compiler/fixtures/phase21_query_shape_trusted_baseline.expected.c'
      - 'compiler/fixtures/phase21_query_shape_untrusted_baseline.expected.c'
      - 'compiler/phase20_resource_empty_forge_invalid.gst'
      - 'compiler/CRANELIFT_PHASE21_INERT_SCOPED_QUERY_RECORDS.md'
      - 'scripts/cranelift_feature_registry.json'
      - 'scripts/cranelift_feature_registry.schema.json'
      - 'scripts/cranelift_registry.py'
      - 'scripts/cranelift_test_levels.json'
      - 'scripts/phase21_inert_scoped_query_records.py'
      - 'scripts/phase21_inert_scoped_query_records.sh'
      - '.github/workflows/phase21-inert-scoped-query-records.yml'
      - '.github/workflows/pr-fast.yml'
      - 'justfile'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/install-native-deps-ci.sh build-essential curl ripgrep
      - run: bash scripts/install-just-ci.sh "$HOME/.local/bin" && echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: guard-cranelift-phase21-inert-scoped-query-records-contract
        run: just guard-cranelift-phase21-inert-scoped-query-records-contract

  evidence:
    needs: contract
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/install-native-deps-ci.sh build-essential curl ripgrep
      - run: bash scripts/install-just-ci.sh "$HOME/.local/bin" && echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - run: make gust
      - name: guard-cranelift-phase21-inert-scoped-query-records-evidence
        run: just guard-cranelift-phase21-inert-scoped-query-records-evidence
