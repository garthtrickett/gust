name: Cranelift Phase 25 Release Manifest

concurrency:
  group: phase25-release-manifest-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

on:
  pull_request:
    paths:
      - 'docs/RELEASE_MANIFEST.json'
      - 'scripts/phase25_release_manifest.py'
      - '.github/workflows/phase25-release-manifest.yml'
  push:
    branches: [main]
    paths:
      - 'docs/RELEASE_MANIFEST.json'
      - 'scripts/phase25_release_manifest.py'
      - '.github/workflows/phase25-release-manifest.yml'

permissions:
  contents: read

jobs:
  manifest:
    name: Phase 25 release manifest
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Tags, not just the branch. O8 says a release IS an annotated tag and
      # the guard checks that with `git cat-file -t`, which can only answer
      # about objects this checkout has. The default checkout fetches none,
      # so the guard reported "gust-seed-0 is not an annotated tag in this
      # repository" -- true of the runner, false of the repository, and the
      # wrong half to believe. Fetching is the fix; relaxing the check to
      # accept an absent tag would make it pass on a release that was never
      # tagged at all.
      - uses: actions/checkout@v4
        with:
          fetch-tags: true
      - name: guard-cranelift-phase25-release-manifest
        run: python3 scripts/phase25_release_manifest.py validate
