name: Cranelift Phase 25 Release Manifest

concurrency:
  group: phase25-release-manifest-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

on:
  pull_request:
    paths:
      - 'docs/RELEASE_MANIFEST.json'
      - 'scripts/phase25_release_manifest.py'
      - '.github/workflows/phase25-release-manifest.yml'
  push:
    branches: [main]
    paths:
      - 'docs/RELEASE_MANIFEST.json'
      - 'scripts/phase25_release_manifest.py'
      - '.github/workflows/phase25-release-manifest.yml'

permissions:
  contents: read

jobs:
  manifest:
    name: Phase 25 release manifest
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Tags AND the history they point into. O8 says a release IS an
      # annotated tag and the guard checks that with `git cat-file -t`,
      # which can only answer about objects this checkout has. The default
      # checkout fetches neither, so the guard reported "gust-seed-0 is not
      # an annotated tag in this repository" -- true of the runner, false
      # of the repository, and the wrong half to believe.
      #
      # `fetch-tags: true` alone did NOT fix it, measured on run
      # 35691190572. With the default `fetch-depth: 1`, git fetches only
      # tags whose targets are inside the fetched depth, and gust-seed-0
      # points at main@d2e72abb, which a depth-1 checkout of a PR merge ref
      # does not contain. So the depth has to go too.
      #
      # Fetching is the fix rather than relaxing the check: tolerating an
      # absent tag would make this pass on a release that was never tagged
      # at all, which is the one thing it exists to catch.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
      - name: guard-cranelift-phase25-release-manifest
        run: python3 scripts/phase25_release_manifest.py validate
