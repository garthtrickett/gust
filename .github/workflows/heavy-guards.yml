name: Heavy Guards

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: build gust
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install guard tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential curl ripgrep
          mkdir -p "$HOME/.local/bin"
          curl --proto '=https' --tlsv1.2 -sSf https://just.systems/install.sh | bash -s -- --tag 1.55.1 --to "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/just" --version

      - name: Diff check
        run: git diff --check

      - name: Heavy CI surface guard
        run: just guard-cloud-heavy-ci-surface

      - name: Build Gust
        run: make gust

      - name: Upload Gust build outputs
        uses: actions/upload-artifact@v4
        with:
          name: gust-build
          path: |
            ./gust
            build/
          if-no-files-found: error

  guard:
    name: heavy / ${{ matrix.shard }}
    runs-on: ubuntu-latest
    needs: build

    strategy:
      fail-fast: false
      matrix:
        shard:
          - phase9-branch
          - mir-branch
          - migration-surfaces
          - migration-return-int
          - migration-local-binding
          - migration-if-else
          - migration-provenance
          - step51-policy
          - step52-registration
          - step52-lifetime-diagnostics
          - step52-cleanup-boundary
          - step52-terminal-states
          - step52-transfer-defer
          - step52-directory
          - runner-surface
          - parser-raw-casts

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install guard tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential curl ripgrep
          mkdir -p "$HOME/.local/bin"
          curl --proto '=https' --tlsv1.2 -sSf https://just.systems/install.sh | bash -s -- --tag 1.55.1 --to "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/just" --version

      - name: Download Gust build outputs
        uses: actions/download-artifact@v4
        with:
          name: gust-build
          path: .

      - name: Restore executable bit
        run: chmod +x ./gust 2>/dev/null || true

      - name: Run heavy guard shard
        run: just guard-cloud-heavy-shard "${{ matrix.shard }}"

  final:
    name: final diff check
    runs-on: ubuntu-latest
    needs: guard

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Diff check
        run: git diff --check
