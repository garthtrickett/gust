name: Heavy Guards

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential curl ripgrep
      - name: Install just
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://just.systems/install.sh | bash -s -- --tag 1.55.1 --to "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/just" --version
      - name: Build Gust
        run: |
          make gust
          chmod +x ./gust
          ./gust --help >/dev/null 2>&1 || true
          test -d build
      - uses: actions/upload-artifact@v4
        with:
          name: gust-build
          path: |
            ./gust
            build/
          if-no-files-found: error

  guard:
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard:
          - phase9-branch-core-baseline
          - phase9-branch-core-legacy
          - phase9-branch-core-mir-basic
          - phase9-branch-core-mir-bundles
          - phase9-branch-core-mir-block-graphs
          - phase9-branch-compiler-mir-basic
          - phase9-branch-compiler-mir-blocks
          - phase9-branch-translators
          - phase9c-differential-ladder-native
          - mir-branch
          - migration-surfaces
          - migration-return-int
          - migration-local-binding
          - migration-if-else
          - migration-provenance
          - step51-policy
          - step52-registration
          - step52-lifetime-diagnostics
          - step52-cleanup-boundary
          - step52-terminal-states
          - step52-transfer-defer
          - step52-directory
          - runner-surface
          - parser-raw-casts
    steps:
      - uses: actions/checkout@v4
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential curl ripgrep
      - name: Install just
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://just.systems/install.sh | bash -s -- --tag 1.55.1 --to "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/just" --version
      - uses: actions/download-artifact@v4
        with:
          name: gust-build
      - name: Restore Gust executable
        run: |
          chmod +x ./gust
          test -d build
      - name: Heavy guard shard
        run: |
          just guard-cloud-heavy-shard "${{ matrix.shard }}"

  final:
    needs: guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential curl ripgrep
      - name: Install just
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://just.systems/install.sh | bash -s -- --tag 1.55.1 --to "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/just" --version
      - name: Heavy guard CI surface
        run: |
          just guard-cloud-heavy-ci-surface
