name: Heavy Guards

on:
  pull_request:
  push:
    branches:
      - "codex/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    if: >-
      github.event_name == 'push' &&
      startsWith(github.ref_name, 'codex/') &&
      vars.CODEX_GITHUB_ACTOR != '' &&
      github.actor == vars.CODEX_GITHUB_ACTOR
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential curl ripgrep
      - name: Install just
        run: |
          bash scripts/install-just-ci.sh "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Build Gust
        run: |
          make gust
          chmod +x ./gust
          ./gust --help > build/phase10-help.stdout 2> build/phase10-help.stderr
          test -f compiler/phase10_help.txt
          awk '1' compiler/phase10_help.txt > build/phase10-help.expected
          diff -u build/phase10-help.expected build/phase10-help.stdout
          if [ -s build/phase10-help.stderr ]; then
            echo "gust --help unexpectedly wrote to stderr:"
            cat build/phase10-help.stderr
            exit 1
          fi
          test -d build
      - uses: actions/upload-artifact@v4
        with:
          name: gust-build
          path: |
            ./gust
            build/
          if-no-files-found: error

  guard:
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard:
          - phase9-branch-core-baseline
          - phase9-branch-core-legacy
          - phase9-branch-core-mir-basic-scalars
          - phase9-branch-core-mir-basic-calls
          - phase9-branch-core-mir-basic-differential
          - phase9-branch-core-mir-bundles
          - phase9-branch-core-mir-block-graphs
          - phase9-branch-compiler-mir-scalars
          - phase9-branch-compiler-mir-metadata
          - phase9-branch-compiler-mir-blocks
          - phase9-branch-translator-scalar
          - phase9-branch-translator-cfg
          - phase9-branch-translator-metadata
          - phase9-branch-translator-imports
          - phase9c-native-diff-return-local
          - phase9c-native-diff-cfg
          - phase9c-native-diff-metadata
          - phase9c-native-diff-boundary
          - mir-branch
          - migration-surfaces
          - migration-return-int
          - migration-local-binding
          - migration-if-else
          - migration-provenance
          - step51-policy
          - step52-registration
          - step52-lifetime-diagnostics
          - step52-cleanup-boundary
          - step52-terminal-states
          - step52-transfer-defer
          - step52-directory
          - runner-surface
          - parser-raw-casts
    steps:
      - uses: actions/checkout@v4
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential curl ripgrep
      - name: Install just
        run: |
          bash scripts/install-just-ci.sh "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - uses: actions/download-artifact@v4
        with:
          name: gust-build
      - name: Restore Gust executable
        run: |
          chmod +x ./gust
          test -d build
      - name: Heavy guard shard
        run: |
          just guard-cloud-heavy-shard "${{ matrix.shard }}"

  phase9g-link-driver:
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        driver:
          - default
          - gcc
          - clang
        evidence:
          - positive
          - negative
    steps:
      - uses: actions/checkout@v4
      - name: Install Phase 9G link-driver dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential curl ripgrep gcc clang
      - name: Install just
        run: |
          bash scripts/install-just-ci.sh "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - uses: actions/download-artifact@v4
        with:
          name: gust-build
      - name: Restore Gust executable
        run: |
          chmod +x ./gust
          test -d build
      - name: Phase 9G ${{ matrix.driver }} ${{ matrix.evidence }} evidence
        run: |
          case "${{ matrix.driver }}" in
            default) export CC=cc ;;
            gcc) export CC=gcc ;;
            clang) export CC=clang ;;
            *) echo "unknown Phase 9G link driver: ${{ matrix.driver }}" >&2; exit 1 ;;
          esac
          PHASE9G_SKIP_PREREQUISITES=1 just "guard-cranelift-phase9g-${{ matrix.evidence }}-link-matrix"

  final:
    needs: [guard, phase9g-link-driver]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential curl ripgrep
      - name: Install just
        run: |
          bash scripts/install-just-ci.sh "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Heavy and Phase 9G CI surface
        run: |
          just guard-cloud-heavy-ci-surface
          just guard-cranelift-phase9g-ci-surface

