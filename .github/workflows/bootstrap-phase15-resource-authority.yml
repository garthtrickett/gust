name: Bootstrap Phase 15.1 Resource Authority

on:
  push:
    branches:
      - phase15-resource-authority

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase15-resource-authority
      - name: Materialize Patch 15.1 files
        shell: bash
        run: |
          set -euo pipefail
          cat <<'PAYLOAD' | base64 -d | tar -xz
          
          PAYLOAD
          rm -f .github/workflows/bootstrap-phase15-resource-authority.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Implement Phase 15.1 resource authority"
          git push origin HEAD:phase15-resource-authority
