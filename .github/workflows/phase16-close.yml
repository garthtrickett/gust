name: Cranelift Phase 16 Close

on:
  pull_request:
    paths:
      - 'TASK.md'
      - 'scripts/cranelift_feature_registry.json'
      - 'scripts/cranelift_feature_registry.schema.json'
      - 'scripts/cranelift_registry.py'
      - 'scripts/cranelift_test_levels.json'
      - 'scripts/phase16_close.py'
      - 'tests/cranelift/phase16_close_contract.tsv'
      - 'tests/cranelift/phase16_close_review.txt'
      - 'justfile'
      - '.github/workflows/pr-fast.yml'
      - '.github/workflows/phase16-close.yml'
  push:
    branches: [main]
    paths:
      - 'TASK.md'
      - 'scripts/cranelift_feature_registry.json'
      - 'scripts/cranelift_feature_registry.schema.json'
      - 'scripts/cranelift_registry.py'
      - 'scripts/cranelift_test_levels.json'
      - 'scripts/phase16_close.py'
      - 'tests/cranelift/phase16_close_contract.tsv'
      - 'tests/cranelift/phase16_close_review.txt'
      - 'justfile'
      - '.github/workflows/pr-fast.yml'
      - '.github/workflows/phase16-close.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  close:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Cache cargo registry and build outputs
        uses: actions/cache@v4
        with:
          # Only cargo target dirs and the registry. Never build/guards itself:
          # those dirs hold witnesses, mutation requests, and .output sentinels,
          # and restoring stale ones could manufacture a false pass.
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            compiler/experiments/cranelift/target
            build/guards/*/cargo-target
          key: cargo-${{ runner.os }}-${{ github.workflow }}-${{ hashFiles('compiler/experiments/cranelift/Cargo.lock') }}
          restore-keys: |
            cargo-${{ runner.os }}-${{ github.workflow }}-
      - run: bash scripts/install-native-deps-ci.sh ripgrep
      - run: bash scripts/install-just-ci.sh "$HOME/.local/bin"
      - run: just guard-cranelift-phase16-close
