name: Probe — user-namespace bind mount availability

# Throwaway. Answers one question for Patch 24.12 finding (b): can an
# end-to-end mutation probe shadow a tracked JSON manifest with a scratch copy
# inside a mount namespace, so a guard's subprocess tree reads the mutated
# bytes while the tracked file is never written?
#
# This branch is cut from main, so it uses a tracked manifest that exists there.
# The real target (compiler/fixtures/phase24_frozen_oracle_vectors_v1.json) is
# added by PR #392 and is absent here -- the first attempt asserted its presence
# under `bash -e` and died in 8ms without emitting a verdict, which is why every
# step below reports what it found before acting on it.
on:
  push:
    branches: ['probe/**']

jobs:
  unshare-bind-mount:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Report kernel user-namespace policy
        run: |
          uname -a
          for k in kernel.unprivileged_userns_clone user.max_user_namespaces \
                   kernel.apparmor_restrict_unprivileged_userns; do
            printf '%s = %s\n' "$k" "$(sysctl -n $k 2>&1)"
          done
          printf 'unshare binary: %s\n' "$(command -v unshare || echo ABSENT)"

      # `shell: bash` is NOT plain bash -- GitHub maps it to
      # `bash --noprofile --norc -e -o pipefail {0}`. Attempt 2 assumed
      # otherwise, so `NS_OUT=$(unshare ...)` aborted at that line under -e and
      # the captured error was discarded unread. An explicit shell string is the
      # only way to actually drop -e.
      - name: Bind-mount a scratch manifest over a tracked one
        shell: bash --noprofile --norc {0}
        run: |
          TRACKED=scripts/cranelift_test_levels.json
          echo "--- setup ---"
          echo "PWD=$PWD"
          echo "TRACKED=$TRACKED exists=$([ -f "$TRACKED" ] && echo yes || echo no)"
          if [ ! -f "$TRACKED" ]; then
            echo "RESULT: SETUP_FAILED (tracked file absent)"; exit 1
          fi
          ORIG_SHA=$(sha256sum "$TRACKED" | cut -d' ' -f1)
          echo "ORIG_SHA=$ORIG_SHA"

          python3 -c "
          import json
          d = json.load(open('$TRACKED'))
          d['__probe_marker__'] = 'MUTATED'
          json.dump(d, open('/tmp/mutated.json','w'))
          print('wrote /tmp/mutated.json')
          " || { echo "RESULT: SETUP_FAILED (could not build scratch manifest)"; exit 1; }

          # A subprocess tree, because that is what `just -> bash -> python3` is.
          printf '%s\n' \
            '#!/bin/bash' \
            "python3 -c \"import json;print('SUBPROCESS SEES marker =', json.load(open('$TRACKED')).get('__probe_marker__'))\"" \
            > /tmp/reader.sh
          chmod +x /tmp/reader.sh
          echo "reader.sh exists=$([ -x /tmp/reader.sh ] && echo yes || echo no)"

          echo "--- outside namespace, before ---"
          /tmp/reader.sh

          # Decomposed, because "unshare failed" has at least three causes
          # and they need different answers. Each sub-probe reports its own rc
          # and its own output to a file, so nothing is lost to a variable.
          echo "--- can we create a user namespace at all? ---"
          unshare --map-root-user --mount -- true >/tmp/ns1.out 2>&1
          NS1=$?
          echo "userns rc=$NS1"; cat /tmp/ns1.out

          echo "--- can we bind-mount inside it? ---"
          unshare --map-root-user --mount -- \
            bash -c "mount --bind /tmp/mutated.json $PWD/$TRACKED" \
            >/tmp/ns2.out 2>&1
          NS2=$?
          echo "bindmount rc=$NS2"; cat /tmp/ns2.out

          echo "--- does a subprocess tree see the shadowed file? ---"
          unshare --map-root-user --mount -- \
            bash -c "mount --bind /tmp/mutated.json $PWD/$TRACKED && cd $PWD && /tmp/reader.sh" \
            >/tmp/ns3.out 2>&1
          NS_RC=$?
          echo "full rc=$NS_RC"; cat /tmp/ns3.out
          NS_OUT=$(cat /tmp/ns3.out)

          echo "--- outside namespace, after ---"
          /tmp/reader.sh
          AFTER_SHA=$(sha256sum "$TRACKED" | cut -d' ' -f1)
          echo "AFTER_SHA matches original: $([ "$AFTER_SHA" = "$ORIG_SHA" ] && echo yes || echo NO)"

          echo "--- verdict ---"
          if [ "$NS1" -ne 0 ]; then
            echo "RESULT: USERNS_UNAVAILABLE (rc=$NS1)"; exit 1
          fi
          if [ "$NS2" -ne 0 ]; then
            echo "RESULT: BIND_MOUNT_REFUSED (userns ok, mount rc=$NS2)"; exit 1
          fi
          if [ "$NS_RC" -ne 0 ]; then
            echo "RESULT: READER_FAILED (mount ok, rc=$NS_RC)"; exit 1
          fi
          if ! printf '%s' "$NS_OUT" | grep -q "marker = MUTATED"; then
            echo "RESULT: MOUNT_DID_NOT_TAKE (namespace entered, file not shadowed)"
            exit 1
          fi
          if [ "$ORIG_SHA" != "$AFTER_SHA" ]; then
            echo "RESULT: TRACKED_FILE_WAS_MODIFIED"; exit 1
          fi
          echo "RESULT: BIND_MOUNT_USABLE (tracked digest unchanged: $ORIG_SHA)"

      - name: Git must agree the tree is clean
        if: always()
        run: |
          git status --porcelain
          if [ -z "$(git status --porcelain)" ]; then
            echo "RESULT: TREE_CLEAN"
          else
            echo "RESULT: TREE_DIRTY"; exit 1
          fi
