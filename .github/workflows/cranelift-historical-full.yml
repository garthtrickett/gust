name: Cranelift Historical Full

on:
  schedule:
    - cron: "23 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inventory:
    if: >-
      github.event_name == 'schedule' ||
      (github.event_name == 'workflow_dispatch' &&
       vars.CODEX_GITHUB_ACTOR != '' &&
       github.actor == vars.CODEX_GITHUB_ACTOR)
    name: Project declared Phase 14 targets
    runs-on: ubuntu-latest
    outputs:
      phase14_targets: ${{ steps.phase14_targets.outputs.matrix }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Project target matrix from registry authority
        id: phase14_targets
        run: echo "matrix=$(python3 scripts/phase14_composition.py target-matrix-json)" >> "$GITHUB_OUTPUT"

  historical-full:
    name: Level 3 full history
    runs-on: ubuntu-latest
    needs: inventory
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential curl ripgrep gcc clang

      - name: Install just
        run: |
          bash scripts/install-just-ci.sh "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Build Gust
        run: make gust

      - name: Run full history outside the external Phase 14 target matrix
        run: PHASE14_HISTORICAL_EXTERNAL_MATRIX=1 just guard-cranelift-historical-full

  phase14-target:
    name: Phase 14 target / ${{ matrix.target }}
    runs-on: ubuntu-latest
    needs: inventory
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.inventory.outputs.phase14_targets) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential curl ripgrep gcc clang

      - name: Install just
        run: |
          bash scripts/install-just-ci.sh "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Build Gust
        run: make gust

      - name: Run representative Phase 14 composition for declared target
        run: |
          PHASE14_TARGET="${{ matrix.target }}" \
            just guard-cranelift-phase14-all-target-composition

  final:
    name: Level 3 declared-target completion
    runs-on: ubuntu-latest
    needs: [historical-full, phase14-target]
    steps:
      - name: Confirm full history and target matrix
        run: echo "Full history and all registry-derived Phase 14 target jobs passed."
