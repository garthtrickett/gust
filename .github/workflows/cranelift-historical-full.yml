name: Cranelift Historical Full

on:
  schedule:
    - cron: "23 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  historical-full:
    if: >-
      github.event_name == 'schedule' ||
      (github.event_name == 'workflow_dispatch' &&
       vars.CODEX_GITHUB_ACTOR != '' &&
       github.actor == vars.CODEX_GITHUB_ACTOR)
    name: Level 3 full history
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential curl ripgrep gcc clang

      - name: Install just
        run: |
          bash scripts/install-just-ci.sh "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Build Gust
        run: make gust

      - name: Run full Cranelift history
        run: just guard-cranelift-historical-full
