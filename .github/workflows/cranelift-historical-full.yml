name: Cranelift Historical Full

on:
  schedule:
    - cron: "23 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inventory:
    if: >-
      github.event_name == 'schedule' ||
      (github.event_name == 'workflow_dispatch' &&
       vars.CODEX_GITHUB_ACTOR != '' &&
       github.actor == vars.CODEX_GITHUB_ACTOR)
    name: Project declared Phase 14 targets
    runs-on: ubuntu-latest
    timeout-minutes: 180
    outputs:
      phase14_targets: ${{ steps.phase14_targets.outputs.matrix }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Project target matrix from registry authority
        id: phase14_targets
        run: echo "matrix=$(python3 scripts/phase14_composition.py target-matrix-json)" >> "$GITHUB_OUTPUT"

  historical-full:
    name: Level 3 full history
    runs-on: ubuntu-latest
    timeout-minutes: 180
    needs: inventory
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache cargo registry and build outputs
        uses: actions/cache@v4
        with:
          # Only cargo target dirs and the registry. Never build/guards itself:
          # those dirs hold witnesses, mutation requests, and .output sentinels,
          # and restoring stale ones could manufacture a false pass.
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            compiler/experiments/cranelift/target
            build/guards/*/cargo-target
          key: cargo-${{ runner.os }}-${{ github.workflow }}-${{ hashFiles('compiler/experiments/cranelift/Cargo.lock') }}
          restore-keys: |
            cargo-${{ runner.os }}-${{ github.workflow }}-
      - name: Install system dependencies
        run: |
          bash scripts/install-native-deps-ci.sh build-essential curl ripgrep gcc clang

      - name: Install just
        run: |
          bash scripts/install-just-ci.sh "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Build Gust
        run: make gust

      - name: Run full history outside the external Phase 14 target matrix
        run: |
          PHASE14_HISTORICAL_EXTERNAL_MATRIX=1 just guard-cranelift-historical-full
          just guard-cranelift-phase15-complete-resource-evidence
          just guard-cranelift-phase16-complete-abi-evidence
          just guard-cranelift-phase17-complete-runtime-evidence

  phase14-target:
    name: Phase 14 target / ${{ matrix.target }}
    runs-on: ubuntu-latest
    timeout-minutes: 180
    needs: inventory
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.inventory.outputs.phase14_targets) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          bash scripts/install-native-deps-ci.sh build-essential curl ripgrep gcc clang

      - name: Install just
        run: |
          bash scripts/install-just-ci.sh "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Build Gust
        run: make gust

      - name: Run representative Phase 14 composition for declared target
        run: |
          PHASE14_TARGET="${{ matrix.target }}" \
            just guard-cranelift-phase14-all-target-composition

  final:
    name: Level 3 declared-target completion
    runs-on: ubuntu-latest
    timeout-minutes: 180
    needs: [historical-full, phase14-target]
    steps:
      - name: Confirm full history and target matrix
        run: echo "Full history and all registry-derived Phase 14 target jobs passed."
