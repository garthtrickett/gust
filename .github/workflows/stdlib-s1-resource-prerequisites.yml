name: Stdlib S1 Resource Prerequisites

# Pins the current handoff: CR-5's resource floor is resolved, while CR-15 owns
# the bounded compiler derivation required by the selected MutexGuard surface.

on:
  pull_request:
    paths:
      - 'compiler/typechecker.gst'
      - 'compiler/lexer.gst'
      - 'STEP52_RESOURCE_SEMANTICS.md'
      - 'TASK_STDLIB.md'
      - 'docs/SHARED_SEMANTIC_ZONE.md'
      - 'docs/STDLIB_FOUNDATIONS.md'
      - 'docs/STDLIB_SURFACE_FINDINGS.md'
      - 'docs/VISION.md'
      - 'tests/stdlib_s1_mutex_guard_generic_derivation_*.gst'
      - 'justfile'
      - '.github/workflows/stdlib-s1-resource-prerequisites.yml'
  push:
    branches: [main]
    paths:
      - 'compiler/typechecker.gst'
      - 'STEP52_RESOURCE_SEMANTICS.md'
      - 'TASK_STDLIB.md'
      - 'docs/SHARED_SEMANTIC_ZONE.md'
      - 'docs/STDLIB_FOUNDATIONS.md'
      - 'docs/STDLIB_SURFACE_FINDINGS.md'
      - 'docs/VISION.md'
      - 'tests/stdlib_s1_mutex_guard_generic_derivation_*.gst'
      - 'justfile'
      - '.github/workflows/stdlib-s1-resource-prerequisites.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  resource-prerequisites:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/install-native-deps-ci.sh build-essential curl ripgrep
      - run: bash scripts/install-just-ci.sh "$HOME/.local/bin" && echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: guard-stdlib-s1-resource-prerequisites
        run: just guard-stdlib-s1-resource-prerequisites
