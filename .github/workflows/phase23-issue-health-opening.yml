name: Cranelift Phase 23 Issue Health Opening

on:
  pull_request:
    paths:
      - 'TASK.md'
      - 'GEMINI.md'
      - 'gust_v4.c'
      - 'compiler/*.gst'
      - 'compiler/CRANELIFT_PHASE23_ISSUE_HEALTH_OPENING.md'
      - 'compiler/experiments/cranelift/**'
      - 'docs/ISSUE_ROADMAP.md'
      - 'docs/ROADMAP_TAIL.md'
      - 'docs/SEMANTIC_CHANGE_ASSURANCE.md'
      - 'src/runtime.c'
      - 'src/runtime/**'
      - 'tools/normalize_generated_arena_offsets.py'
      - 'scripts/cranelift_feature_registry.json'
      - 'scripts/cranelift_feature_registry.schema.json'
      - 'scripts/cranelift_registry.py'
      - 'scripts/cranelift_test_levels.json'
      - 'scripts/phase20_resource_acquisition.py'
      - 'scripts/phase20_resource_acquisition.sh'
      - 'scripts/phase23_issue_health_opening.py'
      - '.github/workflows/phase23-issue-health-opening.yml'
      - '.github/workflows/pr-fast.yml'
      - 'justfile*'
  push:
    branches: [main]
    paths:
      - 'TASK.md'
      - 'GEMINI.md'
      - 'gust_v4.c'
      - 'compiler/*.gst'
      - 'compiler/CRANELIFT_PHASE23_ISSUE_HEALTH_OPENING.md'
      - 'compiler/experiments/cranelift/**'
      - 'docs/ISSUE_ROADMAP.md'
      - 'docs/ROADMAP_TAIL.md'
      - 'docs/SEMANTIC_CHANGE_ASSURANCE.md'
      - 'src/runtime.c'
      - 'src/runtime/**'
      - 'tools/normalize_generated_arena_offsets.py'
      - 'scripts/cranelift_feature_registry.json'
      - 'scripts/cranelift_feature_registry.schema.json'
      - 'scripts/cranelift_registry.py'
      - 'scripts/cranelift_test_levels.json'
      - 'scripts/phase20_resource_acquisition.py'
      - 'scripts/phase20_resource_acquisition.sh'
      - 'scripts/phase23_issue_health_opening.py'
      - '.github/workflows/phase23-issue-health-opening.yml'
      - '.github/workflows/pr-fast.yml'
      - 'justfile*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/install-native-deps-ci.sh build-essential curl ripgrep
      - run: bash scripts/install-just-ci.sh "$HOME/.local/bin" && echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: guard-cranelift-phase23-issue-health-opening-contract
        run: just guard-cranelift-phase23-issue-health-opening-contract

  evidence:
    needs: contract
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/install-native-deps-ci.sh build-essential curl ripgrep
      - run: bash scripts/install-just-ci.sh "$HOME/.local/bin" && echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - run: make phase10-native-package
      - name: guard-cranelift-phase23-issue-health-opening-evidence
        run: just guard-cranelift-phase23-issue-health-opening-evidence
