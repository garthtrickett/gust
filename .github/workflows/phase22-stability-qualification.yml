name: Cranelift Phase 22 Stability Qualification

on:
  pull_request:
    paths:
      - 'TASK.md'
      - 'Makefile'
      - 'README.md'
      - 'gust_v4.c'
      - 'compiler/*.gst'
      - 'compiler/CRANELIFT_PHASE22_STABILITY_QUALIFICATION.md'
      - 'compiler/experiments/cranelift/**'
      - 'docs/ONE_WAY_LEDGER.md'
      - 'src/runtime.c'
      - 'src/runtime/**'
      - 'tools/normalize_generated_arena_offsets.py'
      - 'scripts/*.py'
      - 'scripts/*.sh'
      - 'scripts/cranelift_feature_registry.json'
      - 'scripts/cranelift_feature_registry.schema.json'
      - 'scripts/cranelift_registry.py'
      - 'scripts/cranelift_test_levels.json'
      - 'tests/*.gst'
      - '.github/workflows/cranelift-historical-full.yml'
      - '.github/workflows/phase22-opening.yml'
      - '.github/workflows/phase22-native-implicit-output.yml'
      - '.github/workflows/phase22-default-native-package.yml'
      - '.github/workflows/phase22-preflip-default-cohort.yml'
      - '.github/workflows/phase22-default-route-flip.yml'
      - '.github/workflows/phase22-postflip-qualification.yml'
      - '.github/workflows/phase22-historical-route-successor.yml'
      - '.github/workflows/phase22-stability-qualification.yml'
      - '.github/workflows/pr-fast.yml'
      - 'justfile*'
  push:
    branches: [main]
    paths:
      - 'TASK.md'
      - 'Makefile'
      - 'README.md'
      - 'gust_v4.c'
      - 'compiler/*.gst'
      - 'compiler/CRANELIFT_PHASE22_STABILITY_QUALIFICATION.md'
      - 'compiler/experiments/cranelift/**'
      - 'docs/ONE_WAY_LEDGER.md'
      - 'src/runtime.c'
      - 'src/runtime/**'
      - 'tools/normalize_generated_arena_offsets.py'
      - 'scripts/*.py'
      - 'scripts/*.sh'
      - 'scripts/cranelift_feature_registry.json'
      - 'scripts/cranelift_feature_registry.schema.json'
      - 'scripts/cranelift_registry.py'
      - 'scripts/cranelift_test_levels.json'
      - 'tests/*.gst'
      - '.github/workflows/cranelift-historical-full.yml'
      - '.github/workflows/phase22-opening.yml'
      - '.github/workflows/phase22-native-implicit-output.yml'
      - '.github/workflows/phase22-default-native-package.yml'
      - '.github/workflows/phase22-preflip-default-cohort.yml'
      - '.github/workflows/phase22-default-route-flip.yml'
      - '.github/workflows/phase22-postflip-qualification.yml'
      - '.github/workflows/phase22-historical-route-successor.yml'
      - '.github/workflows/phase22-stability-qualification.yml'
      - '.github/workflows/pr-fast.yml'
      - 'justfile*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/install-native-deps-ci.sh build-essential curl ripgrep
      - run: bash scripts/install-just-ci.sh "$HOME/.local/bin" && echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: guard-cranelift-phase22-stability-qualification-contract
        run: just guard-cranelift-phase22-stability-qualification-contract

  evidence:
    needs: contract
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/install-native-deps-ci.sh build-essential curl ripgrep gcc clang
      - run: bash scripts/install-just-ci.sh "$HOME/.local/bin" && echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - run: rustup toolchain install 1.97.1 --profile minimal --no-self-update
      - run: make phase10-native-package
      - name: guard-cranelift-phase22-stability-qualification-evidence
        run: just guard-cranelift-phase22-stability-qualification-evidence
