name: Cranelift Phase 21 Per-Root Obligations

on:
  pull_request:
    paths:
      - 'TASK.md'
      - 'compiler/*.gst'
      - 'compiler/CRANELIFT_PHASE21_TRUSTED_SCOPE_PROVENANCE.md'
      - 'compiler/CRANELIFT_PHASE21_PER_ROOT_OBLIGATIONS.md'
      - 'scripts/cranelift_feature_registry.json'
      - 'scripts/cranelift_feature_registry.schema.json'
      - 'scripts/cranelift_registry.py'
      - 'scripts/cranelift_test_levels.json'
      - 'scripts/phase21_trusted_scope_provenance.py'
      - 'scripts/phase21_per_root_obligations.py'
      - 'scripts/phase21_per_root_obligations.sh'
      - '.github/workflows/phase21-per-root-obligations.yml'
      - '.github/workflows/pr-fast.yml'
      - 'justfile'
  push:
    branches: [main]
    paths:
      - 'TASK.md'
      - 'compiler/*.gst'
      - 'compiler/CRANELIFT_PHASE21_TRUSTED_SCOPE_PROVENANCE.md'
      - 'compiler/CRANELIFT_PHASE21_PER_ROOT_OBLIGATIONS.md'
      - 'scripts/cranelift_feature_registry.json'
      - 'scripts/cranelift_feature_registry.schema.json'
      - 'scripts/cranelift_registry.py'
      - 'scripts/cranelift_test_levels.json'
      - 'scripts/phase21_trusted_scope_provenance.py'
      - 'scripts/phase21_per_root_obligations.py'
      - 'scripts/phase21_per_root_obligations.sh'
      - '.github/workflows/phase21-per-root-obligations.yml'
      - '.github/workflows/pr-fast.yml'
      - 'justfile'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/install-native-deps-ci.sh build-essential curl ripgrep
      - run: bash scripts/install-just-ci.sh "$HOME/.local/bin" && echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - run: just guard-cranelift-phase21-per-root-obligations-contract

  evidence:
    needs: contract
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/install-native-deps-ci.sh build-essential curl ripgrep
      - run: bash scripts/install-just-ci.sh "$HOME/.local/bin" && echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - run: make gust
      - run: just guard-cranelift-phase21-per-root-obligations-evidence
