name: Cranelift Phase 25 No-C-Compiler Falsifier

# D8: the only honest falsifier for "a clean machine builds and tests Gust
# without invoking a C compiler" is a job on an image with no C compiler.
#
# O4: it is EXPECTED RED while scripts/phase25_no_c_expected_failures.json
# has entries, and expected to fail only for reasons on that list. It is
# deliberately NOT a required check and deliberately NOT continue-on-error
# -- there is no continue-on-error anywhere in this repository's workflows,
# and a silently-tolerated red is decoration. The contract is in the guard,
# the list is read at runtime, and the job reports what remains.
#
# Promotion is mechanical but not automatic (P8): when the list empties the
# guard says "ready for promotion", and a patch flips this to required.

on:
  pull_request:
    paths:
      - 'compiler/**'
      - 'justfile'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'flake.nix'
      - 'scripts/phase25_no_c_expected_failures.json'
      - 'scripts/phase25_no_c_falsifier.py'
      - 'src/runtime/**'
      - 'Makefile'
      - '.github/workflows/phase25-no-c-falsifier.yml'
  push:
    branches: [main]
    paths:
      - 'compiler/**'
      - 'justfile'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'flake.nix'
      - 'scripts/phase25_no_c_expected_failures.json'
      - 'scripts/phase25_no_c_falsifier.py'
      - 'src/runtime/**'
      - 'Makefile'
      - '.github/workflows/phase25-no-c-falsifier.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  contract:
    name: Phase 25 expected-failure list contract
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      # This half must stay green: it checks the LIST's shape, not the gate.
      # Every entry must say what clears it, or it is permanent by accident.
      - name: guard-cranelift-phase25-no-c-falsifier
        run: python3 scripts/phase25_no_c_falsifier.py validate

  no-c-image:
    name: Phase 25 no-C-compiler falsifier (expected red)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      # Ubuntu runners ship a C compiler, so the falsifier must not see
      # one. An earlier revision uninstalled the toolchain, which trips the CI
      # surface guards -- they police what workflows may do to a runner,
      # and mutating the image is exactly what they exist to catch.
      #
      # Shadowing PATH is better anyway: it does not mutate the runner, it
      # is what was validated locally, and the guard still refuses to
      # certify if it can see a compiler -- so the method cannot silently
      # fail open.
      - name: Build a PATH with no C compiler
        run: |
          mkdir -p "$RUNNER_TEMP/nocc"
          for b in python3 sh bash cat grep sed git; do
            ln -sf "$(command -v $b)" "$RUNNER_TEMP/nocc/$b" || true
          done
          echo "NOCC_PATH=$RUNNER_TEMP/nocc" >> "$GITHUB_ENV"
      # The guard exits 1 on purpose: it is a pre-registered expected failure
      # that stays red until Phase 25 lands. A bare `run:` reads that intended
      # state as a broken job, so the assertion is inverted here instead of
      # suppressed with continue-on-error -- which would also swallow a crash,
      # and would notice nothing on the day the contract finally clears.
      - name: guard-cranelift-phase25-no-c-falsifier (expected red)
        run: |
          set +e
          out="$(env PATH="$NOCC_PATH" python3 scripts/phase25_no_c_falsifier.py check-environment 2>&1)"
          status=$?
          set -e
          echo "$out"
          expected="$(python3 -c 'import json; print(len(json.load(open("scripts/phase25_no_c_expected_failures.json"))["entries"]))')"
          if [ "$status" -eq 0 ]; then
            echo "::error::the falsifier is GREEN: the C-free claim now holds, so this expected-red job and the contract it guards are what must change" >&2
            exit 1
          fi
          if [ "$status" -ne 1 ]; then
            echo "::error::the falsifier exited $status; an expected red is exactly 1, and a crash must not be read as one" >&2
            exit 1
          fi
          if ! printf '%s\n' "$out" | grep -qF "EXPECTED RED. $expected reasons remain"; then
            echo "::error::reported reason count disagrees with the $expected entries in scripts/phase25_no_c_expected_failures.json" >&2
            exit 1
          fi
          echo "expected red confirmed: exit 1 with $expected registered reasons"
      # check-environment only proves compiler names are absent from PATH.
      # That certifies nothing about Gust, so the workload runs too and its
      # failure is classified against the tracked list. Same inversion: red
      # is required while the list is non-empty, and a failure for an
      # untracked reason is a regression, which the guard reports itself.
      - name: guard-cranelift-phase25-no-c-falsifier run-workload (expected red)
        run: |
          set +e
          out="$(python3 scripts/phase25_no_c_falsifier.py run-workload 2>&1)"
          status=$?
          set -e
          echo "$out"
          if [ "$status" -eq 0 ]; then
            echo "::error::the no-C workload SUCCEEDED while the expected-failure list is non-empty; the gate may now hold, which is a change this job must not pass silently" >&2
            exit 1
          fi
          if ! printf '%s\n' "$out" | grep -q "EXPECTED RED, and the workload was run"; then
            echo "::error::the workload failed for an untracked reason -- a regression, not progress" >&2
            exit 1
          fi
          echo "expected red confirmed by running the workload, not by inspecting PATH"

  gnu-smoke:
    name: Phase 25 gnu smoke subset
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/install-native-deps-ci.sh build-essential curl ripgrep
      - run: bash scripts/install-just-ci.sh "$HOME/.local/bin" && echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      # O5/P9: ONE gnu job, and the subset is enumerated literally here.
      # A computed subset -- "everything tagged smoke", "the fast half" --
      # drifts toward nothing as tags rot, and the job stays green while
      # covering less. "Supported" means exactly these three things pass on
      # gnu; everything else is proved on musl only, and the docs say so.
      - name: build the compiler
        run: make gust
      - name: bootstrap fixed point
        run: make bootstrap
      - name: one exec test per backend route
        run: just guard-cranelift-return-int-native-smoke
