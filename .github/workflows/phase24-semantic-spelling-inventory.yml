name: Cranelift Phase 24 Semantic Spelling Inventory

on:
  pull_request:
    paths:
      - 'TASK.md'
      - 'compiler/**/*.gst'
      - 'compiler/experiments/cranelift/src/**/*.rs'
      - 'compiler/CRANELIFT_PHASE24_SEMANTIC_SPELLING_INVENTORY.md'
      - 'scripts/cranelift_feature_registry.json'
      - 'scripts/cranelift_feature_registry.schema.json'
      - 'scripts/cranelift_registry.py'
      - 'scripts/cranelift_test_levels.json'
      - 'scripts/phase24_semantic_spelling_inventory.py'
      - '.github/workflows/phase24-semantic-spelling-inventory.yml'
      - '.github/workflows/pr-fast.yml'
      - 'justfile*'
  push:
    branches: [main]
    paths:
      - 'TASK.md'
      - 'compiler/**/*.gst'
      - 'compiler/experiments/cranelift/src/**/*.rs'
      - 'compiler/CRANELIFT_PHASE24_SEMANTIC_SPELLING_INVENTORY.md'
      - 'scripts/cranelift_feature_registry.json'
      - 'scripts/cranelift_feature_registry.schema.json'
      - 'scripts/cranelift_registry.py'
      - 'scripts/cranelift_test_levels.json'
      - 'scripts/phase24_semantic_spelling_inventory.py'
      - '.github/workflows/phase24-semantic-spelling-inventory.yml'
      - '.github/workflows/pr-fast.yml'
      - 'justfile*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/install-native-deps-ci.sh build-essential curl ripgrep
      - run: bash scripts/install-just-ci.sh "$HOME/.local/bin" && echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: guard-cranelift-phase24-semantic-spelling-inventory-contract
        run: just guard-cranelift-phase24-semantic-spelling-inventory-contract
