name: Cranelift Phase 25 Runtime Port

# Patch 25.5, extended by Patch 25.7. Guards that had no workflow, so they
# never ran.
#
# Patch 25.10a retired the staleness guard with the file it watched.
# src/runtime/strings.c was GENERATED from compiler/runtime/strings.gst
# and checked in, so it needed re-diffing on every change; it is now in
# src/runtime-rs and there is nothing to go stale. What replaces the two
# steps is a differential against the retired C, pinned by git blob.
on:
  pull_request:
  push:
    branches: [main]

jobs:
  runtime-port:
    name: runtime port
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: extractions/setup-just@v2

      # Cheap and independent of the compiler: link a C caller against the
      # Rust crate and run it. First, so it fails fast.
      - name: ABI smoke
        run: just guard-cranelift-phase25-runtime-rs-abi-smoke

      # Patch 25.10a. Also before `make gust`, and deliberately so: the
      # two steps this replaces needed the compiler, and this one does
      # not. It links a C driver against the runtime archive and against
      # the retired src/runtime/strings.c, fetched by its pinned git
      # blob and renamed with objcopy so both sides can coexist. Nothing
      # here compiles Gust, so a disagreement between the Rust runtime
      # and the C it replaced is reported in seconds rather than after a
      # bootstrap.
      - name: Strings runtime matches the C it replaced
        run: just guard-cranelift-phase25-strings-rust-parity

      # These two need ./gust, which the bootstrap produces.
      - name: Build the compiler
        run: make gust

      # Patch 25.7. Last, because it is the most expensive step here: it
      # builds the compiler twice. Measured at 2m51s warm and about eleven
      # minutes from a clean checkout, where it builds the native package
      # itself -- which is what the job's 60-minute budget is sized on. It
      # is measured rather than assumed; the Level 1 job spent this whole
      # phase being killed at 45 minutes because its budget was a guess.
      - name: Native fixed point
        run: just guard-cranelift-phase25-native-fixed-point
