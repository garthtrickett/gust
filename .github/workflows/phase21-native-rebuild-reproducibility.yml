name: Cranelift Phase 21 Native Rebuild Reproducibility

on:
  pull_request:
    paths:
      - 'TASK.md'
      - 'Makefile'
      - 'docs/VISION.md'
      - 'gust_v4.c'
      - 'compiler/*.gst'
      - 'compiler/CRANELIFT_PHASE21_ROADMAP.md'
      - 'compiler/CRANELIFT_PHASE21_NATIVE_REBUILD_REPRODUCIBILITY.md'
      - 'compiler/experiments/cranelift/**'
      - 'src/runtime.c'
      - 'src/runtime/**'
      - 'scripts/cranelift_feature_registry.json'
      - 'scripts/cranelift_feature_registry.schema.json'
      - 'scripts/cranelift_registry.py'
      - 'scripts/cranelift_test_levels.json'
      - 'scripts/phase21_cranelift_built_compiler_programs.py'
      - 'scripts/phase21_roadmap.py'
      - 'scripts/phase21_native_rebuild_reproducibility.py'
      - '.github/workflows/phase21-cranelift-built-compiler-programs.yml'
      - '.github/workflows/phase21-native-rebuild-reproducibility.yml'
      - '.github/workflows/pr-fast.yml'
      - 'justfile'
  push:
    branches: [main]
    paths:
      - 'TASK.md'
      - 'Makefile'
      - 'docs/VISION.md'
      - 'gust_v4.c'
      - 'compiler/*.gst'
      - 'compiler/CRANELIFT_PHASE21_ROADMAP.md'
      - 'compiler/CRANELIFT_PHASE21_NATIVE_REBUILD_REPRODUCIBILITY.md'
      - 'compiler/experiments/cranelift/**'
      - 'src/runtime.c'
      - 'src/runtime/**'
      - 'scripts/cranelift_feature_registry.json'
      - 'scripts/cranelift_feature_registry.schema.json'
      - 'scripts/cranelift_registry.py'
      - 'scripts/cranelift_test_levels.json'
      - 'scripts/phase21_cranelift_built_compiler_programs.py'
      - 'scripts/phase21_roadmap.py'
      - 'scripts/phase21_native_rebuild_reproducibility.py'
      - '.github/workflows/phase21-cranelift-built-compiler-programs.yml'
      - '.github/workflows/phase21-native-rebuild-reproducibility.yml'
      - '.github/workflows/pr-fast.yml'
      - 'justfile'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  RUSTUP_TOOLCHAIN: "1.97.1"
  LANG: C.UTF-8
  LC_ALL: C.UTF-8
  TZ: UTC
  SOURCE_DATE_EPOCH: "0"
  CC: cc
  CFLAGS: -O2 -Wall -pthread
  GUST_AUTHORITATIVE_SOURCE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - run: bash scripts/install-native-deps-ci.sh build-essential curl ripgrep
      - run: bash scripts/install-just-ci.sh "$HOME/.local/bin" && echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: guard-cranelift-phase21-native-rebuild-reproducibility-contract
        run: just guard-cranelift-phase21-native-rebuild-reproducibility-contract

  evidence:
    needs: contract
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - run: bash scripts/install-native-deps-ci.sh build-essential curl ripgrep
      - run: bash scripts/install-just-ci.sh "$HOME/.local/bin" && echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - run: rustup toolchain install 1.97.1 --profile minimal --no-self-update
      - run: make gust phase10-native-package
      - name: guard-cranelift-phase21-native-rebuild-reproducibility-evidence
        run: just guard-cranelift-phase21-native-rebuild-reproducibility-evidence
