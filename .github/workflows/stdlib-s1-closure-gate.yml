name: Stdlib S1 Closure Gate

# The closure gate is the thing that stops Phase S1 being declared finished while
# patches are still open. Without this workflow the guard exists but never runs,
# which is the failure mode the gate is meant to prevent in the first place.

on:
  pull_request:
    paths:
      - 'TASK_STDLIB.md'
      - 'justfile'
      - '.github/workflows/stdlib-s1-closure-gate.yml'
  push:
    branches: [main]
    paths:
      - 'TASK_STDLIB.md'
      - 'justfile'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  closure-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/install-native-deps-ci.sh ripgrep
      - run: bash scripts/install-just-ci.sh "$HOME/.local/bin" && echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: guard-stdlib-s1-close
        run: just guard-stdlib-s1-close
