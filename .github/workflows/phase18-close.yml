name: Cranelift Phase 18 Closure

on:
  pull_request:
    paths:
      - 'scripts/cranelift_feature_registry.json'
      - 'scripts/cranelift_feature_registry.schema.json'
      - 'scripts/cranelift_registry.py'
      - 'scripts/phase18_closure.py'
      - 'scripts/phase18_deferrals.py'
      - 'tests/cranelift/phase18_closure_contract.tsv'
      - 'docs/PHASE18_CLOSURE.md'
      - '.github/workflows/phase18-close.yml'
      - 'TASK.md'
  push:
    branches: [main]
    paths:
      - 'scripts/cranelift_feature_registry.json'
      - 'scripts/phase18_closure.py'
      - 'tests/cranelift/phase18_closure_contract.tsv'
      - 'docs/PHASE18_CLOSURE.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  close:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/install-native-deps-ci.sh build-essential curl ripgrep
      - run: bash scripts/install-just-ci.sh "$HOME/.local/bin" && echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: guard-cranelift-phase18-close
        run: just guard-cranelift-phase18-close
