name: Cranelift Phase 21 OD-8 Adversarial Verdict

on:
  pull_request:
    paths:
      - 'TASK.md'
      - 'docs/VISION.md'
      - 'docs/SHARED_SEMANTIC_ZONE.md'
      - 'compiler/*.gst'
      - 'compiler/CRANELIFT_PHASE21_ROADMAP.md'
      - 'compiler/CRANELIFT_PHASE21_OD8_ADVERSARIAL_VERDICT.md'
      - 'scripts/cranelift_feature_registry.json'
      - 'scripts/cranelift_feature_registry.schema.json'
      - 'scripts/cranelift_registry.py'
      - 'scripts/cranelift_test_levels.json'
      - 'scripts/phase21_roadmap.py'
      - 'scripts/phase21_od8_adversarial_verdict.py'
      - 'scripts/phase21_od8_adversarial_verdict.sh'
      - '.github/workflows/phase21-od8-adversarial-verdict.yml'
      - '.github/workflows/pr-fast.yml'
      - 'justfile'
  push:
    branches: [main]
    paths:
      - 'TASK.md'
      - 'docs/VISION.md'
      - 'docs/SHARED_SEMANTIC_ZONE.md'
      - 'compiler/*.gst'
      - 'compiler/CRANELIFT_PHASE21_ROADMAP.md'
      - 'compiler/CRANELIFT_PHASE21_OD8_ADVERSARIAL_VERDICT.md'
      - 'scripts/cranelift_feature_registry.json'
      - 'scripts/cranelift_feature_registry.schema.json'
      - 'scripts/cranelift_registry.py'
      - 'scripts/cranelift_test_levels.json'
      - 'scripts/phase21_roadmap.py'
      - 'scripts/phase21_od8_adversarial_verdict.py'
      - 'scripts/phase21_od8_adversarial_verdict.sh'
      - '.github/workflows/phase21-od8-adversarial-verdict.yml'
      - '.github/workflows/pr-fast.yml'
      - 'justfile'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/install-native-deps-ci.sh build-essential curl ripgrep
      - run: bash scripts/install-just-ci.sh "$HOME/.local/bin" && echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - run: just guard-cranelift-phase21-od8-adversarial-verdict-contract

  evidence:
    needs: contract
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/install-native-deps-ci.sh build-essential curl ripgrep
      - run: bash scripts/install-just-ci.sh "$HOME/.local/bin" && echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - run: make gust
      - run: just guard-cranelift-phase21-od8-adversarial-verdict-evidence
