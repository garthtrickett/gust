name: Cranelift Phase 15 Deferred Residue Audit

on:
  pull_request:
    paths:
      - 'scripts/cranelift_feature_registry.json'
      - 'scripts/cranelift_feature_registry.schema.json'
      - 'scripts/cranelift_registry.py'
      - 'scripts/cranelift_test_levels.json'
      - 'scripts/phase15_deferred_residue_audit.py'
      - 'tests/cranelift/phase15_deferred_residue_audit_contract.tsv'
      - 'tests/cranelift/phase15_deferred_residue_audit_review.txt'
      - 'compiler/future/p17_async_unwind_resource_cleanup_source.gst'
      - 'compiler/p17_async_unwind_resource_cleanup_deferred_source.gst'
      - 'compiler/future/p17_foreign_exception_resource_cleanup_source.gst'
      - 'compiler/p17_foreign_exception_resource_cleanup_deferred_source.gst'
      - 'compiler/future/p19_cancellation_resource_cleanup_source.gst'
      - 'compiler/p19_cancellation_resource_cleanup_deferred_source.gst'
      - 'justfile'
      - '.github/workflows/phase15-deferred-residue-audit.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/cranelift_feature_registry.json'
      - 'scripts/cranelift_feature_registry.schema.json'
      - 'scripts/cranelift_registry.py'
      - 'scripts/cranelift_test_levels.json'
      - 'scripts/phase15_deferred_residue_audit.py'
      - 'tests/cranelift/phase15_deferred_residue_audit_contract.tsv'
      - 'tests/cranelift/phase15_deferred_residue_audit_review.txt'
      - 'compiler/future/p17_async_unwind_resource_cleanup_source.gst'
      - 'compiler/p17_async_unwind_resource_cleanup_deferred_source.gst'
      - 'compiler/future/p17_foreign_exception_resource_cleanup_source.gst'
      - 'compiler/p17_foreign_exception_resource_cleanup_deferred_source.gst'
      - 'compiler/future/p19_cancellation_resource_cleanup_source.gst'
      - 'compiler/p19_cancellation_resource_cleanup_deferred_source.gst'
      - 'justfile'
      - '.github/workflows/phase15-deferred-residue-audit.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/install-just-ci.sh "$HOME/.local/bin"
      - run: just guard-cranelift-phase15-deferred-residue-audit
