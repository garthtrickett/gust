name: Cranelift Phase 24 CR-15 Closure

on:
  pull_request:
    paths:
      - 'TASK.md'
      - 'docs/PHASE24_CR15_CLOSURE.md'
      - 'docs/COMPILER_ARCHITECTURE_CONSOLIDATION.md'
      - 'docs/SHARED_SEMANTIC_ZONE.md'
      - 'gust_v4.c'
      - 'compiler/*.gst'
      - 'compiler/experiments/cranelift/**'
      - 'compiler/CRANELIFT_PHASE24_CR15_*.md'
      - 'src/runtime.c'
      - 'src/runtime/**'
      - 'tests/phase24_cr15_*.gst'
      - 'tools/normalize_generated_arena_offsets.py'
      - 'scripts/cranelift_feature_registry.json'
      - 'scripts/cranelift_feature_registry.schema.json'
      - 'scripts/cranelift_registry.py'
      - 'scripts/cranelift_test_levels.json'
      - 'scripts/phase24_cr15_*.py'
      - 'scripts/phase22_default_route_seed_convergence.py'
      - 'scripts/phase23_production_release_audit.py'
      - '.github/workflows/phase24-cr15-closure.yml'
      - '.github/workflows/pr-fast.yml'
      - 'justfile*'
      - 'Makefile'
  push:
    branches: [main]
    paths:
      - 'TASK.md'
      - 'docs/PHASE24_CR15_CLOSURE.md'
      - 'docs/COMPILER_ARCHITECTURE_CONSOLIDATION.md'
      - 'docs/SHARED_SEMANTIC_ZONE.md'
      - 'gust_v4.c'
      - 'compiler/*.gst'
      - 'compiler/experiments/cranelift/**'
      - 'compiler/CRANELIFT_PHASE24_CR15_*.md'
      - 'src/runtime.c'
      - 'src/runtime/**'
      - 'tests/phase24_cr15_*.gst'
      - 'tools/normalize_generated_arena_offsets.py'
      - 'scripts/cranelift_feature_registry.json'
      - 'scripts/cranelift_feature_registry.schema.json'
      - 'scripts/cranelift_registry.py'
      - 'scripts/cranelift_test_levels.json'
      - 'scripts/phase24_cr15_*.py'
      - 'scripts/phase22_default_route_seed_convergence.py'
      - 'scripts/phase23_production_release_audit.py'
      - '.github/workflows/phase24-cr15-closure.yml'
      - '.github/workflows/pr-fast.yml'
      - 'justfile*'
      - 'Makefile'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/install-native-deps-ci.sh build-essential curl ripgrep
      - run: bash scripts/install-just-ci.sh "$HOME/.local/bin" && echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: guard-cranelift-phase24-cr15-close
        run: just guard-cranelift-phase24-cr15-close

  evidence:
    needs: contract
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/install-native-deps-ci.sh build-essential curl ripgrep
      - run: bash scripts/install-just-ci.sh "$HOME/.local/bin" && echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: guard-cranelift-phase24-cr15-close-evidence
        run: just guard-cranelift-phase24-cr15-close-evidence
