name: Cranelift Phase 19 Type Naming

on:
  pull_request:
    paths:
      - 'compiler/codegen.gst'
      - 'compiler/typechecker.gst'
      - 'compiler/typechecker_templates_test_entry.gst'
      - 'compiler/phase19_type_naming_explicit_source.gst'
      - 'compiler/phase19_type_naming_inferred_source.gst'
      - 'compiler/CRANELIFT_PHASE19_TYPE_NAMING.md'
      - 'scripts/cranelift_feature_registry.json'
      - 'scripts/cranelift_feature_registry.schema.json'
      - 'scripts/cranelift_registry.py'
      - 'scripts/cranelift_test_levels.json'
      - 'scripts/phase19_type_naming.py'
      - 'scripts/phase19_type_naming_parity.sh'
      - '.github/workflows/phase19-type-naming.yml'
      - '.github/workflows/pr-fast.yml'
      - 'justfile'
      - 'TASK.md'
  push:
    branches: [main]
    paths:
      - 'compiler/codegen.gst'
      - 'compiler/typechecker.gst'
      - 'compiler/phase19_type_naming_explicit_source.gst'
      - 'compiler/phase19_type_naming_inferred_source.gst'
      - 'compiler/CRANELIFT_PHASE19_TYPE_NAMING.md'
      - 'scripts/phase19_type_naming.py'
      - 'scripts/phase19_type_naming_parity.sh'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/install-native-deps-ci.sh build-essential curl ripgrep
      - run: bash scripts/install-just-ci.sh "$HOME/.local/bin" && echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: guard-cranelift-phase19-type-naming-contract
        run: just guard-cranelift-phase19-type-naming-contract

  parity:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/install-native-deps-ci.sh build-essential curl ripgrep
      - run: bash scripts/install-just-ci.sh "$HOME/.local/bin" && echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - run: make gust
      - name: guard-cranelift-phase19-type-naming-parity
        run: just guard-cranelift-phase19-type-naming-parity
