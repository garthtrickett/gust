name: Cranelift Phase 21 Typed Query No-op Surface

on:
  pull_request:
    paths:
      - 'TASK.md'
      - 'compiler/*.gst'
      - 'compiler/fixtures/phase21_query_shape_*.expected.c'
      - 'compiler/CRANELIFT_PHASE21_TYPED_QUERY_NOOP_SURFACE.md'
      - 'scripts/cranelift_feature_registry.json'
      - 'scripts/cranelift_feature_registry.schema.json'
      - 'scripts/cranelift_registry.py'
      - 'scripts/cranelift_test_levels.json'
      - 'scripts/phase21_opening.py'
      - 'scripts/phase21_typed_query_noop_surface.py'
      - 'scripts/phase21_typed_query_noop_surface.sh'
      - '.github/workflows/phase21-typed-query-noop-surface.yml'
      - '.github/workflows/pr-fast.yml'
      - 'justfile'
  push:
    branches: [main]
    paths:
      - 'TASK.md'
      - 'compiler/*.gst'
      - 'compiler/fixtures/phase21_query_shape_*.expected.c'
      - 'compiler/CRANELIFT_PHASE21_TYPED_QUERY_NOOP_SURFACE.md'
      - 'scripts/cranelift_feature_registry.json'
      - 'scripts/cranelift_feature_registry.schema.json'
      - 'scripts/cranelift_registry.py'
      - 'scripts/cranelift_test_levels.json'
      - 'scripts/phase21_opening.py'
      - 'scripts/phase21_typed_query_noop_surface.py'
      - 'scripts/phase21_typed_query_noop_surface.sh'
      - '.github/workflows/phase21-typed-query-noop-surface.yml'
      - '.github/workflows/pr-fast.yml'
      - 'justfile'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/install-native-deps-ci.sh build-essential curl ripgrep
      - run: bash scripts/install-just-ci.sh "$HOME/.local/bin" && echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: guard-cranelift-phase21-typed-query-noop-surface-contract
        run: just guard-cranelift-phase21-typed-query-noop-surface-contract

  evidence:
    needs: contract
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/install-native-deps-ci.sh build-essential curl ripgrep
      - run: bash scripts/install-just-ci.sh "$HOME/.local/bin" && echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - run: make gust
      - name: guard-cranelift-phase21-typed-query-noop-surface-evidence
        run: just guard-cranelift-phase21-typed-query-noop-surface-evidence
