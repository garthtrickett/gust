name: Cranelift Phase 19 Seed Convergence

on:
  pull_request:
    paths:
      - 'gust_v4.c'
      - 'compiler/CRANELIFT_PHASE19_SEED_CONVERGENCE.md'
      - 'compiler/CRANELIFT_PHASE20_SEED_CONVERGENCE.md'
      - 'compiler/CRANELIFT_PHASE20_POST_PREREQUISITE_SEED_CONVERGENCE.md'
      - 'compiler/CRANELIFT_PHASE20_PROTECTED_ACCESS_SEED_CONVERGENCE.md'
      - 'compiler/CRANELIFT_PHASE21_TENANT_SCOPE_SEED_CONVERGENCE.md'
      - 'compiler/CRANELIFT_PHASE21_NATIVE_FEATURE_SEED_CONVERGENCE.md'
      - 'compiler/CRANELIFT_PHASE22_DEFAULT_ROUTE_SEED_CONVERGENCE.md'
      - 'scripts/cranelift_feature_registry.json'
      - 'scripts/cranelift_feature_registry.schema.json'
      - 'scripts/cranelift_registry.py'
      - 'scripts/cranelift_test_levels.json'
      - 'scripts/phase19_seed_convergence.py'
      - 'scripts/phase20_seed_convergence.py'
      - 'scripts/phase20_post_prerequisite_seed_convergence.py'
      - 'scripts/phase20_protected_access_seed_convergence.py'
      - 'scripts/phase21_tenant_scope_seed_convergence.py'
      - 'scripts/phase21_native_feature_seed_convergence.py'
      - 'scripts/phase22_default_route_seed_convergence.py'
      - 'TASK.md'
      - 'justfile'
      - '.github/workflows/pr-fast.yml'
      - '.github/workflows/phase19-seed-convergence.yml'
  push:
    branches: [main]
    paths:
      - 'compiler/*.gst'
      - 'gust_v4.c'
      - 'compiler/CRANELIFT_PHASE19_SEED_CONVERGENCE.md'
      - 'compiler/CRANELIFT_PHASE20_SEED_CONVERGENCE.md'
      - 'compiler/CRANELIFT_PHASE20_POST_PREREQUISITE_SEED_CONVERGENCE.md'
      - 'compiler/CRANELIFT_PHASE20_PROTECTED_ACCESS_SEED_CONVERGENCE.md'
      - 'compiler/CRANELIFT_PHASE21_TENANT_SCOPE_SEED_CONVERGENCE.md'
      - 'compiler/CRANELIFT_PHASE21_NATIVE_FEATURE_SEED_CONVERGENCE.md'
      - 'compiler/CRANELIFT_PHASE22_DEFAULT_ROUTE_SEED_CONVERGENCE.md'
      - 'scripts/cranelift_feature_registry.json'
      - 'scripts/cranelift_feature_registry.schema.json'
      - 'scripts/cranelift_test_levels.json'
      - 'scripts/phase19_seed_convergence.py'
      - 'scripts/phase20_seed_convergence.py'
      - 'scripts/phase20_post_prerequisite_seed_convergence.py'
      - 'scripts/phase20_protected_access_seed_convergence.py'
      - 'scripts/phase21_tenant_scope_seed_convergence.py'
      - 'scripts/phase21_native_feature_seed_convergence.py'
      - 'scripts/phase22_default_route_seed_convergence.py'
      - 'TASK.md'
      - 'justfile'
      - '.github/workflows/pr-fast.yml'
      - '.github/workflows/phase19-seed-convergence.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/install-native-deps-ci.sh build-essential curl ripgrep
      - run: bash scripts/install-just-ci.sh "$HOME/.local/bin" && echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: guard-cranelift-phase19-seed-convergence
        run: just guard-cranelift-phase19-seed-convergence
      - name: guard-cranelift-phase20-seed-convergence
        run: just guard-cranelift-phase20-seed-convergence
      - name: Build Gust for Patch 20.14a semantic guard
        run: make gust
      - name: guard-cranelift-phase20-post-prerequisite-seed-convergence
        run: just guard-cranelift-phase20-post-prerequisite-seed-convergence
      - name: guard-cranelift-phase20-protected-access-seed-convergence
        run: just guard-cranelift-phase20-protected-access-seed-convergence
      - name: guard-cranelift-phase21-tenant-scope-seed-convergence
        run: just guard-cranelift-phase21-tenant-scope-seed-convergence
      - name: guard-cranelift-phase21-native-feature-seed-convergence
        run: just guard-cranelift-phase21-native-feature-seed-convergence
      - name: guard-cranelift-phase22-default-route-seed-convergence
        run: just guard-cranelift-phase22-default-route-seed-convergence

  fixed-point:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Select authoritative seed-convergence scope
        id: seed_scope
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "$EVENT_NAME" != "pull_request" ]; then
            echo "required=true" >> "$GITHUB_OUTPUT"
          elif git diff --quiet "$BASE_SHA" "$HEAD_SHA" -- \
            gust_v4.c \
            compiler/CRANELIFT_PHASE19_SEED_CONVERGENCE.md \
            compiler/CRANELIFT_PHASE20_SEED_CONVERGENCE.md \
            compiler/CRANELIFT_PHASE20_POST_PREREQUISITE_SEED_CONVERGENCE.md \
            compiler/CRANELIFT_PHASE20_PROTECTED_ACCESS_SEED_CONVERGENCE.md \
            compiler/CRANELIFT_PHASE21_TENANT_SCOPE_SEED_CONVERGENCE.md \
            compiler/CRANELIFT_PHASE21_NATIVE_FEATURE_SEED_CONVERGENCE.md \
            compiler/CRANELIFT_PHASE22_DEFAULT_ROUTE_SEED_CONVERGENCE.md \
            scripts/phase19_seed_convergence.py \
            scripts/phase20_seed_convergence.py \
            scripts/phase20_post_prerequisite_seed_convergence.py \
            scripts/phase20_protected_access_seed_convergence.py \
            scripts/phase21_tenant_scope_seed_convergence.py \
            scripts/phase21_native_feature_seed_convergence.py \
            scripts/phase22_default_route_seed_convergence.py; then
            echo "required=false" >> "$GITHUB_OUTPUT"
          else
            echo "required=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Capability PR defers generated seed to its roadmap seed patch
        if: steps.seed_scope.outputs.required != 'true'
        run: echo "Seed-owned files unchanged; fixed point remains enforced on main."
      - if: steps.seed_scope.outputs.required == 'true'
        run: bash scripts/install-native-deps-ci.sh build-essential curl ripgrep
      - name: Three-stage bootstrap convergence
        if: steps.seed_scope.outputs.required == 'true'
        run: CC=cc CFLAGS="-O0 -w -pthread" make bootstrap
      - name: The C fixed point is retired, and its stages are not produced
        if: steps.seed_scope.outputs.required == 'true'
        # Patch 25.10 inverts `make bootstrap`. It used to emit stage-two and
        # stage-three C and this step compared them; there is no emitter, so
        # those files are never written and `cmp` fails on missing operands --
        # which reads as a convergence failure rather than as a retirement.
        #
        # Inverted the same way the step below it was when the seed went: the
        # claim that is still worth making is that the C stages are GONE and
        # the fixed point that replaced them RAN. The bootstrap target itself
        # runs scripts/phase25_native_fixed_point.sh and fails if the objects
        # diverge, so this step asserts the shape rather than re-running it.
        run: |
          for stale in build/gust_stage2.c build/gust_stage3.c; do
            if [ -e "$stale" ]; then
              echo "::error::$stale exists after the bootstrap; the C fixed" \
                   "point was retired in Patch 25.10 and nothing should be" \
                   "emitting stage C again"
              exit 1
            fi
          done
          echo "no stage-two or stage-three C: the fixed point is the native" \
               "one, over emitted objects"
      - name: Regeneration does not recreate the deleted seed
        if: steps.seed_scope.outputs.required == 'true'
        run: |
          # Patch 25.9 deleted gust_v4.c. This step used to assert
          # "regeneration leaves the committed seed unchanged", and with
          # no seed `git diff -- gust_v4.c` reports nothing, so it passed
          # while verifying nothing at all. Inverted to the claim that is
          # still worth making: the bootstrap must not put the file back.
          if [ -e gust_v4.c ]; then
            echo "gust_v4.c exists after the bootstrap."
            echo "Patch 25.9 removed the seed and the line that"
            echo "republished it -- the copy of stage 3 output"
            echo "If the file is back, so is that route."
            exit 1
          fi
          if git ls-files --error-unmatch gust_v4.c >/dev/null 2>&1; then
            echo "gust_v4.c is tracked again; the deletion was reverted."
            exit 1
          fi
          python3 scripts/phase22_default_route_seed_convergence.py check-regeneration
