name: Cranelift Phase26 First Release

on:
  pull_request:
    paths:
      - 'compiler/**'
      - 'src/runtime-rs/**'
      - 'src/stdlib/native_bytes.gst'
      - 'tests/stdlib_s26_1_*.gst'
      - 'scripts/stdlib_s26_1_native_bytes.py'
      - 'scripts/phase26_*.py'
      - 'scripts/phase26_*.sh'
      - 'scripts/phase25_native_fixed_point.sh'
      - 'Makefile'
      - 'justfile'
      - '.github/workflows/phase26-release-closure.yml'
      - '.github/workflows/cranelift-historical-full.yml'
  push:
    branches: [main]
    paths:
      - 'compiler/**'
      - 'src/runtime-rs/**'
      - 'src/stdlib/native_bytes.gst'
      - 'tests/stdlib_s26_1_*.gst'
      - 'scripts/stdlib_s26_1_native_bytes.py'
      - 'scripts/phase26_*.py'
      - 'scripts/phase26_*.sh'
      - 'scripts/phase25_native_fixed_point.sh'
      - 'Makefile'
      - 'justfile'
      - '.github/workflows/phase26-release-closure.yml'
      - '.github/workflows/cranelift-historical-full.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  qualification:
    if: github.actor == vars.CODEX_GITHUB_ACTOR && (github.event_name != 'pull_request' || startsWith(github.head_ref, 'codex/'))
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install existing build dependencies
        run: |
          bash scripts/install-native-deps-ci.sh build-essential curl ripgrep
          bash scripts/install-just-ci.sh "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Pin the enrolled production toolchain
        run: python3 scripts/phase26_production_toolchain.py install-ci build/phase26-release-toolchain
      - name: Build current native compiler
        run: python3 scripts/phase26_release_bounded.py make gust
      - name: Reproduce exact public native package inputs
        run: |
          mkdir -p build/guards/phase26_r3_zlib_adapter
          curl --proto '=https' --tlsv1.2 --fail --location --silent --show-error \
            --retry 3 --max-time 90 https://zlib.net/zlib-1.3.2.tar.gz \
            --output build/guards/phase26_r3_zlib_adapter/zlib-1.3.2.tar.gz
          bash scripts/phase26_r3_zlib_adapter.sh \
            build/guards/phase26_r3_zlib_adapter/zlib-1.3.2.tar.gz \
            build/guards/phase26_r3_zlib_adapter/build
      - name: Qualify first-release compiler, runtime, fixed point, production and public interface
        run: python3 scripts/phase26_release_bounded.py just guard-cranelift-phase26-release-closure
      - name: Retain exact-source qualification and failure evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase26-first-release-qualification
          if-no-files-found: error
          include-hidden-files: true
          path: |
            build/guards/phase26_release_qualification.json
            build/guards/phase26_release_regression/
            build/guards/phase26_production_trust/
            build/guards/stdlib_s26_1_public_qualification/
            build/native-fp/
            build/native-stage1
            build/native-stage2
