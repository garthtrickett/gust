name: Cranelift Phase 21 Closure

on:
  pull_request:
    paths:
      - 'scripts/cranelift_feature_registry.json'
      - 'scripts/cranelift_feature_registry.schema.json'
      - 'scripts/cranelift_registry.py'
      - 'scripts/cranelift_test_levels.json'
      - 'scripts/phase21_od8_adversarial_verdict.py'
      - 'scripts/phase21_tenant_scope_seed_convergence.py'
      - 'scripts/phase21_native_feature_seed_convergence.py'
      - 'scripts/phase21_native_rebuild_reproducibility.py'
      - 'scripts/phase21_complete_guard_suite.py'
      - 'scripts/phase21_closure.py'
      - 'tests/cranelift/phase21_closure_contract.tsv'
      - 'compiler/CRANELIFT_PHASE21_OD8_ADVERSARIAL_VERDICT.md'
      - 'compiler/CRANELIFT_PHASE21_TENANT_SCOPE_SEED_CONVERGENCE.md'
      - 'compiler/CRANELIFT_PHASE21_NATIVE_FEATURE_SEED_CONVERGENCE.md'
      - 'compiler/CRANELIFT_PHASE21_NATIVE_REBUILD_REPRODUCIBILITY.md'
      - 'compiler/CRANELIFT_PHASE21_COMPLETE_GUARD_SUITE.md'
      - 'docs/PHASE21_CLOSURE.md'
      - '.github/workflows/phase21-close.yml'
      - '.github/workflows/pr-fast.yml'
      - 'justfile'
      - 'TASK.md'
  push:
    branches: [main]
    paths:
      - 'scripts/cranelift_feature_registry.json'
      - 'scripts/cranelift_feature_registry.schema.json'
      - 'scripts/cranelift_registry.py'
      - 'scripts/cranelift_test_levels.json'
      - 'scripts/phase21_od8_adversarial_verdict.py'
      - 'scripts/phase21_tenant_scope_seed_convergence.py'
      - 'scripts/phase21_native_feature_seed_convergence.py'
      - 'scripts/phase21_native_rebuild_reproducibility.py'
      - 'scripts/phase21_complete_guard_suite.py'
      - 'scripts/phase21_closure.py'
      - 'tests/cranelift/phase21_closure_contract.tsv'
      - 'compiler/CRANELIFT_PHASE21_OD8_ADVERSARIAL_VERDICT.md'
      - 'compiler/CRANELIFT_PHASE21_TENANT_SCOPE_SEED_CONVERGENCE.md'
      - 'compiler/CRANELIFT_PHASE21_NATIVE_FEATURE_SEED_CONVERGENCE.md'
      - 'compiler/CRANELIFT_PHASE21_NATIVE_REBUILD_REPRODUCIBILITY.md'
      - 'compiler/CRANELIFT_PHASE21_COMPLETE_GUARD_SUITE.md'
      - 'docs/PHASE21_CLOSURE.md'
      - '.github/workflows/phase21-close.yml'
      - '.github/workflows/pr-fast.yml'
      - 'justfile'
      - 'TASK.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  close:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/install-native-deps-ci.sh build-essential curl ripgrep
      - run: bash scripts/install-just-ci.sh "$HOME/.local/bin" && echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: guard-cranelift-phase21-close
        run: just guard-cranelift-phase21-close
