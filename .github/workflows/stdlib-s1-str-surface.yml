name: Stdlib S1 Str Surface

# Pins the observable behaviour of the string surface. Any change to a value in
# the regression suite is a semantic change to `str` and must be deliberate.

on:
  pull_request:
    paths:
      - 'src/runtime/strings.c'
      - 'compiler/typechecker.gst'
      - 'compiler/codegen.gst'
      - 'tests/test_str_surface_regression.gst'
      - '.github/workflows/stdlib-s1-str-surface.yml'
  push:
    branches: [main]
    paths:
      - 'src/runtime/strings.c'
      - 'tests/test_str_surface_regression.gst'
      - '.github/workflows/stdlib-s1-str-surface.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  str-surface:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/install-native-deps-ci.sh build-essential curl ripgrep
      - run: bash scripts/install-just-ci.sh "$HOME/.local/bin" && echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: guard-stdlib-s1-str-surface
        run: just guard-stdlib-s1-str-surface
