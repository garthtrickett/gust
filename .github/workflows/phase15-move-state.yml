name: Cranelift Phase 15 Move State

on:
  pull_request:
    paths:
      - 'compiler/mir_resource_authority.gst'
      - 'compiler/mir_resource_value.gst'
      - 'compiler/mir_resource_value_mir_to_c.gst'
      - 'compiler/mir_native_backend_resource_mir_request.gst'
      - 'compiler/mir_resource_move_state_smoke_test_entry.gst'
      - 'compiler/mir_resource_move_parity_smoke_test_entry.gst'
      - 'compiler/experiments/cranelift/src/resource_mir.rs'
      - 'scripts/phase15_move_state.py'
      - 'scripts/phase15_move_state_parity.sh'
      - 'scripts/guard-cranelift-phase15-move-state-contract.sh'
      - 'scripts/cranelift_test_levels.json'
      - 'tests/cranelift/phase15_move_state_contract.tsv'
      - 'tests/cranelift/phase15_move_state_review.txt'
      - 'justfile'
      - '.github/workflows/phase15-move-state.yml'
  push:
    branches: [main]
    paths:
      - 'compiler/mir_resource_authority.gst'
      - 'compiler/mir_resource_value.gst'
      - 'compiler/mir_resource_value_mir_to_c.gst'
      - 'compiler/mir_native_backend_resource_mir_request.gst'
      - 'compiler/mir_resource_move_state_smoke_test_entry.gst'
      - 'compiler/mir_resource_move_parity_smoke_test_entry.gst'
      - 'compiler/experiments/cranelift/src/resource_mir.rs'
      - 'scripts/phase15_move_state.py'
      - 'scripts/phase15_move_state_parity.sh'
      - 'scripts/guard-cranelift-phase15-move-state-contract.sh'
      - 'scripts/cranelift_test_levels.json'
      - 'tests/cranelift/phase15_move_state_contract.tsv'
      - 'tests/cranelift/phase15_move_state_review.txt'
      - 'justfile'
      - '.github/workflows/phase15-move-state.yml'

jobs:
  move-state-contract:
    name: Phase 15.3 move-state contract (Level 1)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned just
        run: |
          bash scripts/install-just-ci.sh "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: guard-cranelift-phase15-move-state-contract
        run: just guard-cranelift-phase15-move-state-contract

  move-state-parity:
    name: Phase 15.3 move-state parity (Level 2)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install native dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential curl ripgrep
      - name: Install pinned just
        run: |
          bash scripts/install-just-ci.sh "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: guard-cranelift-phase15-move-state-parity
        run: just guard-cranelift-phase15-move-state-parity