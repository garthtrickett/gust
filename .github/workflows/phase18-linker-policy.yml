name: Cranelift Phase 18 Linker Policy

on:
  pull_request:
    paths:
      - 'compiler/mir_target_authority.gst'
      - 'compiler/mir_target_request.gst'
      - 'compiler/mir_linker_policy_smoke_test_entry.gst'
      - 'compiler/experiments/cranelift/src/target_authority.rs'
      - 'compiler/experiments/cranelift/src/main.rs'
      - 'scripts/cranelift_feature_registry.json'
      - 'scripts/cranelift_feature_registry.schema.json'
      - 'scripts/cranelift_registry.py'
      - 'scripts/phase18_linker_policy.py'
      - 'scripts/phase18_linker_policy_parity.sh'
      - 'tests/cranelift/phase18_linker_policy_contract.tsv'
      - 'tests/cranelift/phase18_linker_policy_review.txt'
      - '.github/workflows/phase18-linker-policy.yml'
      - 'TASK.md'
  push:
    branches: [main]
    paths:
      - 'compiler/mir_target_authority.gst'
      - 'compiler/mir_target_request.gst'
      - 'scripts/phase18_linker_policy.py'
      - 'scripts/phase18_linker_policy_parity.sh'
      - 'tests/cranelift/phase18_linker_policy_contract.tsv'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/install-native-deps-ci.sh build-essential curl ripgrep
      - run: bash scripts/install-just-ci.sh "$HOME/.local/bin" && echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: guard-cranelift-phase18-linker-policy-contract
        run: just guard-cranelift-phase18-linker-policy-contract

  parity:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Cache cargo registry and build outputs
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            compiler/experiments/cranelift/target
          key: cargo-${{ runner.os }}-${{ github.workflow }}-${{ hashFiles('compiler/experiments/cranelift/Cargo.lock') }}
          restore-keys: |
            cargo-${{ runner.os }}-${{ github.workflow }}-
      - run: bash scripts/install-native-deps-ci.sh build-essential curl ripgrep
      - run: bash scripts/install-just-ci.sh "$HOME/.local/bin" && echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: guard-cranelift-phase18-linker-policy-parity
        run: just guard-cranelift-phase18-linker-policy-parity
