name: Cranelift Phase 15 Resource MIR

on:
  pull_request:
    paths:
      - 'compiler/mir.gst'
      - 'compiler/mir_resource_authority.gst'
      - 'compiler/mir_resource_value.gst'
      - 'compiler/mir_resource_value_mir_to_c.gst'
      - 'compiler/mir_native_backend_resource_mir_request.gst'
      - 'compiler/mir_resource_value_smoke_test_entry.gst'
      - 'compiler/experiments/cranelift/src/main.rs'
      - 'compiler/experiments/cranelift/src/resource_mir.rs'
      - 'scripts/phase15_resource_mir.py'
      - 'scripts/phase15_resource_mir_parity.sh'
      - 'scripts/guard-cranelift-phase15-resource-mir-contract.sh'
      - 'scripts/cranelift_test_levels.json'
      - 'tests/cranelift/phase15_resource_mir_contract.tsv'
      - 'tests/cranelift/phase15_resource_mir_review.txt'
      - 'justfile'
      - '.github/workflows/phase15-resource-mir.yml'
  push:
    branches: [main]
    paths:
      - 'compiler/mir.gst'
      - 'compiler/mir_resource_authority.gst'
      - 'compiler/mir_resource_value.gst'
      - 'compiler/mir_resource_value_mir_to_c.gst'
      - 'compiler/mir_native_backend_resource_mir_request.gst'
      - 'compiler/mir_resource_value_smoke_test_entry.gst'
      - 'compiler/experiments/cranelift/src/main.rs'
      - 'compiler/experiments/cranelift/src/resource_mir.rs'
      - 'scripts/phase15_resource_mir.py'
      - 'scripts/phase15_resource_mir_parity.sh'
      - 'tests/cranelift/phase15_resource_mir_contract.tsv'
      - 'tests/cranelift/phase15_resource_mir_review.txt'
      - 'justfile'
      - '.github/workflows/phase15-resource-mir.yml'

jobs:
  resource-mir-contract:
    name: Phase 15.2 resource MIR contract (Level 1)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned just
        run: |
          bash scripts/install-just-ci.sh "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: guard-cranelift-phase15-resource-mir-contract
        run: just guard-cranelift-phase15-resource-mir-contract

  resource-value-parity:
    name: Phase 15.2 resource value parity (Level 2)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install native dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential curl ripgrep
      - name: Install pinned just
        run: |
          bash scripts/install-just-ci.sh "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: guard-cranelift-phase15-resource-mir-parity
        run: just guard-cranelift-phase15-resource-mir-parity