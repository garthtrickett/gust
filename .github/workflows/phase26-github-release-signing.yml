name: Gust one-shot GitHub Ed25519 candidate
on:
  push:
    branches: [codex/phase26-github-release-signing]
    paths:
      - '.github/workflows/phase26-github-release-signing.yml'
      - 'scripts/phase26_github_package_candidate.py'
      - 'scripts/phase26_github_issue.py'
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  issue-public-candidate:
    if: github.repository_id == '1263612197' && github.actor_id == '3760677' && github.event_name == 'push' && github.ref == 'refs/heads/codex/phase26-github-release-signing' && github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Install only the existing exact public production dependencies
        run: python3 scripts/phase26_production_toolchain.py install-ci build/github-production-toolchain
      - name: Reproduce existing runtime bytes under the protected product cap
        run: python3 scripts/phase26_release_bounded.py make -j2 build/gust-runtime-package.a
      - name: Reproduce pinned zlib and adapter bytes before any key exists
        run: |
          mkdir -p build/github-r3
          curl --proto '=https' --tlsv1.2 --fail --location --silent --show-error \
            --retry 2 --max-time 90 https://zlib.net/fossils/zlib-1.3.2.tar.gz \
            --output build/github-r3/zlib-1.3.2.tar.gz
          bash scripts/phase26_r3_zlib_adapter.sh \
            build/github-r3/zlib-1.3.2.tar.gz build/github-r3/build
      - name: Generate confined one-shot key and issue only a signed public candidate
        env:
          REVIEWED_CANDIDATE_SHA256: 'c00f82cae8bcdf2578d138265a8a88812aa51c4ffc4567d3ea3d6b2323677732'
          REVIEWED_ISSUER_SHA256: 'cc9c7c4e8fb921261ee91f391ca67ec5b70af5f839c8fc406259561655e5785a'
        run: |
          set +x
          python3 scripts/phase26_github_issue.py
      - name: Retain explicit public output only
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: phase26-github-signed-candidate
          if-no-files-found: error
          retention-days: 7
          path: |
            build/guards/phase26_github_signed_candidate/package/
            build/guards/phase26_github_signed_candidate/canonical-message.bin
            build/guards/phase26_github_signed_candidate/signing-request.json
            build/guards/phase26_github_signed_candidate/public-identity.json
            build/guards/phase26_github_signed_candidate/public-key.der
            build/guards/phase26_github_signed_candidate/snapshot.json
            build/guards/phase26_github_signed_candidate/github-provenance.json
