name: Cranelift Phase 18 Cross-Target Composition

on:
  pull_request:
    paths:
      - 'compiler/mir_target_authority.gst'
      - 'compiler/mir_target_request.gst'
      - 'compiler/mir_composition_smoke_test_entry.gst'
      - 'compiler/experiments/cranelift/src/target_authority.rs'
      - 'compiler/experiments/cranelift/src/main.rs'
      - 'scripts/cranelift_feature_registry.json'
      - 'scripts/cranelift_feature_registry.schema.json'
      - 'scripts/cranelift_registry.py'
      - 'scripts/phase18_composition.py'
      - 'scripts/phase18_composition_smoke.sh'
      - 'scripts/phase18_complete_target_evidence.sh'
      - 'scripts/phase18_opening.py'
      - 'tests/cranelift/phase18_composition_contract.tsv'
      - 'tests/cranelift/phase18_composition_review.txt'
      - '.github/workflows/phase18-composition.yml'
      - 'TASK.md'
  push:
    branches: [main]
    paths:
      - 'compiler/mir_target_authority.gst'
      - 'compiler/mir_target_request.gst'
      - 'scripts/phase18_composition.py'
      - 'scripts/phase18_composition_smoke.sh'
      - 'scripts/phase18_complete_target_evidence.sh'
      - 'scripts/phase18_opening.py'
      - 'tests/cranelift/phase18_composition_contract.tsv'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/install-native-deps-ci.sh build-essential curl ripgrep
      - run: bash scripts/install-just-ci.sh "$HOME/.local/bin" && echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: guard-cranelift-phase18-composition-contract
        run: just guard-cranelift-phase18-composition-contract
