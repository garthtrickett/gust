name: Cranelift Phase 15 Manual Close

on:
  pull_request:
    paths:
      - 'compiler/mir_manual_close.gst'
      - 'compiler/mir_manual_close_mir_to_c.gst'
      - 'compiler/mir_manual_close_state_smoke_test_entry.gst'
      - 'compiler/mir_manual_close_parity_smoke_test_entry.gst'
      - 'compiler/experiments/cranelift/src/manual_close.rs'
      - 'compiler/experiments/cranelift/src/main.rs'
      - 'scripts/phase15_manual_close.py'
      - 'scripts/phase15_manual_close_parity.sh'
      - 'scripts/run-gust-file.sh'
      - 'scripts/cranelift_test_levels.json'
      - 'tests/cranelift/phase15_manual_close_contract.tsv'
      - 'tests/cranelift/phase15_manual_close_review.txt'
      - 'justfile'
      - '.github/workflows/phase15-manual-close.yml'
  push:
    branches: [main]
    paths:
      - 'compiler/mir_manual_close.gst'
      - 'compiler/mir_manual_close_mir_to_c.gst'
      - 'compiler/mir_manual_close_state_smoke_test_entry.gst'
      - 'compiler/mir_manual_close_parity_smoke_test_entry.gst'
      - 'compiler/experiments/cranelift/src/manual_close.rs'
      - 'compiler/experiments/cranelift/src/main.rs'
      - 'scripts/phase15_manual_close.py'
      - 'scripts/phase15_manual_close_parity.sh'
      - 'scripts/run-gust-file.sh'
      - 'scripts/cranelift_test_levels.json'
      - 'tests/cranelift/phase15_manual_close_contract.tsv'
      - 'tests/cranelift/phase15_manual_close_review.txt'
      - 'justfile'
      - '.github/workflows/phase15-manual-close.yml'
  workflow_dispatch:

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/install-just-ci.sh "$HOME/.local/bin"
      - name: Phase 15.8 manual close contract (Level 1)
        run: just guard-cranelift-phase15-manual-close-contract
  parity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y build-essential curl ripgrep
      - run: bash scripts/install-just-ci.sh "$HOME/.local/bin"
      - name: Build Gust
        run: make gust
      - name: Phase 15.8 manual close parity (Level 2)
        run: just guard-cranelift-phase15-manual-close-parity
