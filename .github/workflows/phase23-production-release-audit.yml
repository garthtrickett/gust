name: Cranelift Phase 23 Production and Release Audit

on:
  pull_request:
    paths:
      - 'TASK.md'
      - 'README.md'
      - 'GEMINI.md'
      - 'gust_v4.c'
      - 'Makefile'
      - '*.sh'
      - 'compiler/**'
      - 'docs/**'
      - 'scripts/**'
      - 'src/**'
      - 'tests/**'
      - 'justfile*'
      - '.github/workflows/**'
  push:
    branches: [main]
    paths:
      - 'TASK.md'
      - 'README.md'
      - 'GEMINI.md'
      - 'gust_v4.c'
      - 'Makefile'
      - '*.sh'
      - 'compiler/**'
      - 'docs/**'
      - 'scripts/**'
      - 'src/**'
      - 'tests/**'
      - 'justfile*'
      - '.github/workflows/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/install-native-deps-ci.sh build-essential curl ripgrep
      - run: bash scripts/install-just-ci.sh "$HOME/.local/bin" && echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - run: just guard-cranelift-phase23-production-release-audit-contract

  evidence:
    needs: contract
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/install-native-deps-ci.sh build-essential curl ripgrep
      - run: bash scripts/install-just-ci.sh "$HOME/.local/bin" && echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - run: rustup toolchain install 1.97.1 --profile minimal --no-self-update
      - run: make phase10-native-package
      - run: just guard-cranelift-phase23-production-release-audit-evidence
