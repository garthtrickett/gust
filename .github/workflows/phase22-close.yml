name: Cranelift Phase 22 Closure

on:
  pull_request:
    paths:
      - 'TASK.md'
      - 'Makefile'
      - 'README.md'
      - 'gust_v4.c'
      - 'compiler/*.gst'
      - 'compiler/CRANELIFT_PHASE22_*.md'
      - 'compiler/experiments/cranelift/**'
      - 'docs/ONE_WAY_LEDGER.md'
      - 'docs/PHASE22_CLOSURE.md'
      - 'src/runtime.c'
      - 'src/runtime/**'
      - 'tools/normalize_generated_arena_offsets.py'
      - 'scripts/*.py'
      - 'scripts/*.sh'
      - 'scripts/cranelift_feature_registry.json'
      - 'scripts/cranelift_feature_registry.schema.json'
      - 'scripts/cranelift_registry.py'
      - 'scripts/cranelift_test_levels.json'
      - 'tests/cranelift/phase22_closure_contract.tsv'
      - 'tests/*.gst'
      - '.github/workflows/cranelift-historical-full.yml'
      - '.github/workflows/phase22-*.yml'
      - '.github/workflows/pr-fast.yml'
      - 'justfile*'
  push:
    branches: [main]
    paths:
      - 'TASK.md'
      - 'Makefile'
      - 'README.md'
      - 'gust_v4.c'
      - 'compiler/*.gst'
      - 'compiler/CRANELIFT_PHASE22_*.md'
      - 'compiler/experiments/cranelift/**'
      - 'docs/ONE_WAY_LEDGER.md'
      - 'docs/PHASE22_CLOSURE.md'
      - 'src/runtime.c'
      - 'src/runtime/**'
      - 'tools/normalize_generated_arena_offsets.py'
      - 'scripts/*.py'
      - 'scripts/*.sh'
      - 'scripts/cranelift_feature_registry.json'
      - 'scripts/cranelift_feature_registry.schema.json'
      - 'scripts/cranelift_registry.py'
      - 'scripts/cranelift_test_levels.json'
      - 'tests/cranelift/phase22_closure_contract.tsv'
      - 'tests/*.gst'
      - '.github/workflows/cranelift-historical-full.yml'
      - '.github/workflows/phase22-*.yml'
      - '.github/workflows/pr-fast.yml'
      - 'justfile*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  close:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/install-native-deps-ci.sh build-essential curl ripgrep
      - run: bash scripts/install-just-ci.sh "$HOME/.local/bin" && echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: guard-cranelift-phase22-close
        run: just guard-cranelift-phase22-close
