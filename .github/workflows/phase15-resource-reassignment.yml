name: Cranelift Phase 15 Resource Reassignment

on:
  pull_request:
    paths:
      - 'compiler/mir_resource_authority.gst'
      - 'compiler/mir_resource_value.gst'
      - 'compiler/mir_resource_reassignment.gst'
      - 'compiler/mir_resource_reassignment_mir_to_c.gst'
      - 'compiler/mir_resource_reassignment_state_smoke_test_entry.gst'
      - 'compiler/mir_native_backend_resource_mir_request.gst'
      - 'compiler/mir_resource_reassignment_parity_smoke_test_entry.gst'
      - 'compiler/experiments/cranelift/src/resource_mir.rs'
      - 'scripts/phase15_resource_reassignment.py'
      - 'scripts/phase15_resource_reassignment_parity.sh'
      - 'scripts/run-gust-file.sh'
      - 'scripts/guard-cranelift-phase15-resource-reassignment-contract.sh'
      - 'scripts/cranelift_test_levels.json'
      - 'tests/cranelift/phase15_resource_reassignment_contract.tsv'
      - 'tests/cranelift/phase15_resource_reassignment_review.txt'
      - 'justfile'
      - '.github/workflows/phase15-resource-reassignment.yml'
  push:
    branches: [main]
    paths:
      - 'compiler/mir_resource_authority.gst'
      - 'compiler/mir_resource_value.gst'
      - 'compiler/mir_resource_reassignment.gst'
      - 'compiler/mir_resource_reassignment_mir_to_c.gst'
      - 'compiler/mir_resource_reassignment_state_smoke_test_entry.gst'
      - 'compiler/mir_native_backend_resource_mir_request.gst'
      - 'compiler/mir_resource_reassignment_parity_smoke_test_entry.gst'
      - 'compiler/experiments/cranelift/src/resource_mir.rs'
      - 'scripts/phase15_resource_reassignment.py'
      - 'scripts/phase15_resource_reassignment_parity.sh'
      - 'scripts/run-gust-file.sh'
      - 'scripts/guard-cranelift-phase15-resource-reassignment-contract.sh'
      - 'scripts/cranelift_test_levels.json'
      - 'tests/cranelift/phase15_resource_reassignment_contract.tsv'
      - 'tests/cranelift/phase15_resource_reassignment_review.txt'
      - 'justfile'
      - '.github/workflows/phase15-resource-reassignment.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  reassignment-contract:
    name: Phase 15.4 resource reassignment contract (Level 1)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned just
        run: |
          bash scripts/install-just-ci.sh "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: guard-cranelift-phase15-resource-reassignment-contract
        run: just guard-cranelift-phase15-resource-reassignment-contract

  reassignment-parity:
    name: Phase 15.4 resource reassignment parity (Level 2)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Cache cargo registry and build outputs
        uses: actions/cache@v4
        with:
          # Only cargo target dirs and the registry. Never build/guards itself:
          # those dirs hold witnesses, mutation requests, and .output sentinels,
          # and restoring stale ones could manufacture a false pass.
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            compiler/experiments/cranelift/target
            build/guards/*/cargo-target
          key: cargo-${{ runner.os }}-${{ github.workflow }}-${{ hashFiles('compiler/experiments/cranelift/Cargo.lock') }}
          restore-keys: |
            cargo-${{ runner.os }}-${{ github.workflow }}-
      - name: Install native dependencies
        run: bash scripts/install-native-deps-ci.sh build-essential curl ripgrep
      - name: Install pinned just
        run: |
          bash scripts/install-just-ci.sh "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: guard-cranelift-phase15-resource-reassignment-parity
        run: just guard-cranelift-phase15-resource-reassignment-parity
