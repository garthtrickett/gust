name: Cranelift Phase 19 Representation

on:
  pull_request:
    paths:
      - 'compiler/codegen.gst'
      - 'compiler/mir_function_abi_authority.gst'
      - 'compiler/mir_function_call.gst'
      - 'compiler/mir_function_call_mir_to_c.gst'
      - 'compiler/mir_function_call_smoke_test_entry.gst'
      - 'compiler/phase19_argument_representation_a_source.gst'
      - 'compiler/phase19_argument_representation_b_source.gst'
      - 'compiler/experiments/cranelift/src/function_call_mir.rs'
      - 'compiler/CRANELIFT_PHASE19_REPRESENTATION.md'
      - 'scripts/cranelift_feature_registry.json'
      - 'scripts/cranelift_feature_registry.schema.json'
      - 'scripts/cranelift_test_levels.json'
      - 'scripts/phase16_call_mir_parity.sh'
      - 'scripts/phase19_representation.py'
      - 'scripts/phase19_representation_parity.sh'
      - '.github/workflows/phase19-representation.yml'
      - '.github/workflows/pr-fast.yml'
      - 'justfile'
      - 'TASK.md'
  push:
    branches: [main]
    paths:
      - 'compiler/codegen.gst'
      - 'compiler/mir_function_abi_authority.gst'
      - 'compiler/mir_function_call.gst'
      - 'compiler/mir_function_call_mir_to_c.gst'
      - 'compiler/mir_function_call_smoke_test_entry.gst'
      - 'compiler/phase19_argument_representation_a_source.gst'
      - 'compiler/phase19_argument_representation_b_source.gst'
      - 'compiler/experiments/cranelift/src/function_call_mir.rs'
      - 'compiler/CRANELIFT_PHASE19_REPRESENTATION.md'
      - 'scripts/phase19_representation.py'
      - 'scripts/phase19_representation_parity.sh'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/install-native-deps-ci.sh build-essential curl ripgrep
      - run: bash scripts/install-just-ci.sh "$HOME/.local/bin" && echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: guard-cranelift-phase19-representation-contract
        run: just guard-cranelift-phase19-representation-contract

  parity:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/install-native-deps-ci.sh build-essential curl ripgrep
      - run: bash scripts/install-just-ci.sh "$HOME/.local/bin" && echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - run: make gust
      - name: guard-cranelift-phase19-representation-parity
        run: just guard-cranelift-phase19-representation-parity
