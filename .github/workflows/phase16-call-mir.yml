name: Cranelift Phase 16 Call MIR

on:
  pull_request:
    paths:
      - 'compiler/mir.gst'
      - 'compiler/mir_function_abi_authority.gst'
      - 'compiler/mir_function_call.gst'
      - 'compiler/mir_function_call_mir_to_c.gst'
      - 'compiler/mir_native_backend_call_mir_request.gst'
      - 'compiler/mir_function_call_smoke_test_entry.gst'
      - 'compiler/experiments/cranelift/src/main.rs'
      - 'compiler/experiments/cranelift/src/function_call_mir.rs'
      - 'scripts/phase16_call_mir.py'
      - 'scripts/phase16_call_mir_parity.sh'
      - 'scripts/guard-cranelift-phase16-call-mir-contract.sh'
      - 'scripts/cranelift_test_levels.json'
      - 'tests/cranelift/phase16_call_mir_contract.tsv'
      - 'tests/cranelift/phase16_call_mir_review.txt'
      - 'justfile'
      - '.github/workflows/phase16-call-mir.yml'
  push:
    branches: [main]
    paths:
      - 'compiler/mir.gst'
      - 'compiler/mir_function_call.gst'
      - 'compiler/mir_function_call_mir_to_c.gst'
      - 'compiler/mir_native_backend_call_mir_request.gst'
      - 'compiler/mir_function_call_smoke_test_entry.gst'
      - 'compiler/experiments/cranelift/src/main.rs'
      - 'compiler/experiments/cranelift/src/function_call_mir.rs'
      - 'scripts/phase16_call_mir.py'
      - 'scripts/phase16_call_mir_parity.sh'
      - 'tests/cranelift/phase16_call_mir_contract.tsv'
      - 'tests/cranelift/phase16_call_mir_review.txt'
      - 'justfile'
      - '.github/workflows/phase16-call-mir.yml'
  workflow_dispatch:

jobs:
  call-mir-contract:
    name: Phase 16.2 call MIR contract (Level 1)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned just
        run: |
          bash scripts/install-just-ci.sh "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: guard-cranelift-phase16-call-mir-contract
        run: just guard-cranelift-phase16-call-mir-contract

  call-mir-parity:
    name: Phase 16.2 call MIR parity (Level 2)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Cache cargo registry and build outputs
        uses: actions/cache@v4
        with:
          # Only cargo target dirs and the registry. Never build/guards itself:
          # those dirs hold witnesses, mutation requests, and .output sentinels,
          # and restoring stale ones could manufacture a false pass.
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            compiler/experiments/cranelift/target
            build/guards/*/cargo-target
          key: cargo-${{ runner.os }}-${{ github.workflow }}-${{ hashFiles('compiler/experiments/cranelift/Cargo.lock') }}
          restore-keys: |
            cargo-${{ runner.os }}-${{ github.workflow }}-
      - name: Install native dependencies
        run: bash scripts/install-native-deps-ci.sh build-essential curl ripgrep
      - name: Install pinned just
        run: |
          bash scripts/install-just-ci.sh "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: guard-cranelift-phase16-call-mir-parity
        run: just guard-cranelift-phase16-call-mir-parity
      - name: Upload Phase 16.2 call MIR diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase16-call-mir-diagnostics
          if-no-files-found: ignore
          path: |
            to.log
            build/gust-build.log
            build/mir_function_call_smoke_test_entry.compile.log
            build/guards/phase16_call_mir/
