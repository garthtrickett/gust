        run: just guard-cranelift-phase19-retired-prototype-absent

      - name: Phase 19 self-hosted name-list removal
        run: just guard-cranelift-phase19-gust-name-list-removed

      - name: Phase 19 bootstrap seed convergence
        run: just guard-cranelift-phase19-seed-convergence

      - name: Phase 20 bootstrap seed convergence
        run: just guard-cranelift-phase20-seed-convergence

      - name: Phase 20 whole-program corpus and observable contract
        run: just guard-cranelift-phase20-whole-program-corpus-contract

