name: PR Fast

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: build gust
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install guard tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential curl ripgrep
          mkdir -p "$HOME/.local/bin"
          curl --proto '=https' --tlsv1.2 -sSf https://just.systems/install.sh | bash -s -- --tag 1.55.1 --to "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/just" --version

      - name: Diff check
        run: git diff --check

      - name: PR fast CI surface guard
        run: just guard-pr-fast-ci-surface

      - name: Phase 9G CI surface guard
        run: just guard-cranelift-phase9g-ci-surface

      - name: Phase 9G closure guard
        run: just guard-cranelift-phase9g-close

      - name: Phase 10 closure guard
        run: just guard-cranelift-phase10-close

      - name: Build Gust
        run: make gust

      - name: Phase 11 closure guard
        run: just guard-cranelift-phase11-close

      - name: Upload Gust build outputs
        uses: actions/upload-artifact@v4
        with:
          name: gust-build
          path: |
            ./gust
            build/
          if-no-files-found: error

  guard:
    name: guard / ${{ matrix.shard }}
    runs-on: ubuntu-latest
    needs: build

    strategy:
      fail-fast: false
      matrix:
        shard:
          - cranelift-return-int
          - cranelift-local-binding
          - cranelift-branch
          - cranelift-differential
          - cranelift-phase9d-ingestion-ladder
          - cranelift-phase9e-cfg-ladder
          - cranelift-phase9f-call-import-ladder
          - cranelift-phase9g-object-artifact
          - cranelift-phase9g-link-positive
          - cranelift-phase9g-link-negative
          - cranelift-phase11-scalars
          - cranelift-phase11-locals
          - cranelift-phase11-cfg
          - cranelift-phase11-block-params
          - cranelift-phase11-direct-calls
          - cranelift-phase11-imports
          - cranelift-phase11-metadata-diagnostics
          - mir-to-c-return-int
          - routed-return-int
          - migration-return-int
          - migration-local-binding
          - migration-if-else
          - migration-provenance

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install guard tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential curl ripgrep
          mkdir -p "$HOME/.local/bin"
          curl --proto '=https' --tlsv1.2 -sSf https://just.systems/install.sh | bash -s -- --tag 1.55.1 --to "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/just" --version

      - name: Download Gust build outputs
        uses: actions/download-artifact@v4
        with:
          name: gust-build
          path: .

      - name: Restore executable bit
        run: chmod +x ./gust 2>/dev/null || true

      - name: Run PR fast shard
        run: just guard-pr-fast-shard "${{ matrix.shard }}"

  final:
    name: final diff check
    runs-on: ubuntu-latest
    needs: guard

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Diff check
        run: git diff --check
