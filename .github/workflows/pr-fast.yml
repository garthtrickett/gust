      - name: Phase 18 deferral audit and rejection reachability
        run: just guard-cranelift-phase18-deferral-audit

      - name: Phase 18 target object and linker closure
        run: just guard-cranelift-phase18-close

      - name: Phase 19 brand identity and value representation opening
        run: just guard-cranelift-phase19-opening-contract

      - name: Phase 20 opening evidence and qualification authority
        run: just guard-cranelift-phase20-opening-contract

      - name: Phase 20 canonical brand matching
        run: just guard-cranelift-phase20-brand-matching-contract

      - name: Phase 20 nested brand annotation
        run: just guard-cranelift-phase20-nested-brand-annotation-contract

