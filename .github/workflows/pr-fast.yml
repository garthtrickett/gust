      - name: Phase 20 generic guard prerequisites
        run: just guard-cranelift-phase20-generic-guard-prerequisites-contract

      - name: Phase 20 inert resource-rooted access authority
        run: just guard-cranelift-phase20-resource-rooted-access-contract

