      - name: Phase 20 resource declaration migration
        run: just guard-cranelift-phase20-resource-declaration-migration-contract

      - name: Phase 20 resource declaration enforcement
        run: just guard-cranelift-phase20-resource-enforcement-contract

      - name: Phase 20 resource acquisition obligations
        run: just guard-cranelift-phase20-resource-acquisition-contract

      - name: Phase 20 generic resource scope cleanup
        run: just guard-cranelift-phase20-resource-scope-cleanup-contract

      - name: Phase 19 identifier-spelling decision inventory
        run: just guard-cranelift-phase19-spelling-inventory

      - name: Phase 19 compiler-owned brand identity authority
        run: just guard-cranelift-phase19-brand-authority-contract

      - name: Phase 19 canonical branded type naming
        run: just guard-cranelift-phase19-type-naming-contract

      - name: Phase 19 type-derived container and arena classification
        run: just guard-cranelift-phase19-classification-contract

      - name: Phase 19 type-derived argument and index representation
