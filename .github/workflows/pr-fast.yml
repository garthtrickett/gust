name: PR Fast

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: build gust
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install guard tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential curl ripgrep
          mkdir -p "$HOME/.local/bin"
          curl --proto '=https' --tlsv1.2 -sSf https://just.systems/install.sh | bash -s -- --tag 1.55.1 --to "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/just" --version

      - name: Diff check
        run: git diff --check

      - name: PR fast CI surface guard
        run: just guard-pr-fast-ci-surface

      - name: Build Gust
        run: make gust

      - name: Upload Gust build outputs
        uses: actions/upload-artifact@v4
        with:
          name: gust-build
          path: |
            ./gust
            build/
          if-no-files-found: error

  guard:
    name: guard / ${{ matrix.shard }}
    runs-on: ubuntu-latest
    needs: build

    strategy:
      fail-fast: false
      matrix:
        shard:
          - cranelift-return-int
          - cranelift-local-binding
          - cranelift-branch
          - cranelift-differential
          - cranelift-phase9c-differential-ladder
          - cranelift-backend-suite-core-baseline
          - cranelift-backend-suite-core-legacy
          - cranelift-backend-suite-core-mir-basic-arithmetic
          - cranelift-backend-suite-core-mir-basic-calls
          - cranelift-backend-suite-core-mir-bundles
          - cranelift-backend-suite-core-mir-block-graphs
          - cranelift-backend-suite-compiler-mir-scalars
          - cranelift-backend-suite-compiler-mir-metadata
          - cranelift-backend-suite-compiler-mir-blocks
          - cranelift-backend-suite-translator-scalar
          - cranelift-backend-suite-translator-cfg
          - cranelift-backend-suite-translator-metadata
          - cranelift-backend-suite-translator-imports
          - mir-to-c-return-int
          - routed-return-int
          - migration-return-int
          - migration-local-binding
          - migration-if-else
          - migration-provenance

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install guard tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential curl ripgrep
          mkdir -p "$HOME/.local/bin"
          curl --proto '=https' --tlsv1.2 -sSf https://just.systems/install.sh | bash -s -- --tag 1.55.1 --to "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/just" --version

      - name: Download Gust build outputs
        uses: actions/download-artifact@v4
        with:
          name: gust-build
          path: .

      - name: Restore executable bit
        run: chmod +x ./gust 2>/dev/null || true

      - name: Run PR fast shard
        run: just guard-pr-fast-shard "${{ matrix.shard }}"

  final:
    name: final diff check
    runs-on: ubuntu-latest
    needs: guard

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Diff check
        run: git diff --check
