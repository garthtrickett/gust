name: PR Fast

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: build gust
    runs-on: ubuntu-latest
    outputs:
      phase11_families: ${{ steps.phase11_families.outputs.matrix }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install guard tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential curl ripgrep
          bash scripts/install-just-ci.sh "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Diff check
        run: git diff --check

      - name: Project Phase 11 CI families
        id: phase11_families
        run: echo "matrix=$(python3 scripts/cranelift_ci_family.py matrix-json)" >> "$GITHUB_OUTPUT"

      - name: PR fast CI surface guard
        run: just guard-pr-fast-ci-surface

      - name: Phase 9G CI surface guard
        run: just guard-cranelift-phase9g-ci-surface

      - name: Build Gust
        run: make gust

      - name: Upload Gust build outputs
        uses: actions/upload-artifact@v4
        with:
          name: gust-build
          path: |
            ./gust
            build/
          if-no-files-found: error

  guard:
    name: guard / ${{ matrix.shard }}
    runs-on: ubuntu-latest
    needs: build

    strategy:
      fail-fast: false
      matrix:
        shard:
          - cranelift-return-int
          - cranelift-local-binding
          - cranelift-branch
          - cranelift-differential
          - cranelift-phase9d-ingestion-ladder
          - cranelift-phase9e-cfg-ladder
          - cranelift-phase9f-call-import-ladder
          - cranelift-phase9g-object-artifact
          - cranelift-phase9g-link-positive
          - cranelift-phase9g-link-negative
          - mir-to-c-return-int
          - routed-return-int
          - migration-return-int
          - migration-local-binding
          - migration-if-else
          - migration-provenance

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install guard tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential curl ripgrep
          bash scripts/install-just-ci.sh "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Download Gust build outputs
        uses: actions/download-artifact@v4
        with:
          name: gust-build
          path: .

      - name: Restore executable bit
        run: chmod +x ./gust 2>/dev/null || true

      - name: Run PR fast shard
        run: just guard-pr-fast-shard "${{ matrix.shard }}"

  phase11-family:
    name: Phase 11 family / ${{ matrix.family }}
    runs-on: ubuntu-latest
    needs: build
    strategy:
      fail-fast: false
      matrix:
        family: ${{ fromJSON(needs.build.outputs.phase11_families) }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install guard tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential curl ripgrep
          bash scripts/install-just-ci.sh "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Download Gust build outputs
        uses: actions/download-artifact@v4
        with:
          name: gust-build
          path: .

      - name: Restore executable bit
        run: chmod +x ./gust 2>/dev/null || true

      - name: Run Phase 11 CI family
        run: just guard-cranelift-phase11-ci-family "${{ matrix.family }}"

  historical-closure:
    name: historical Phase 11 closure replay
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install guard tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential curl ripgrep
          bash scripts/install-just-ci.sh "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Download Gust build outputs
        uses: actions/download-artifact@v4
        with:
          name: gust-build
          path: .

      - name: Restore executable bit
        run: chmod +x ./gust 2>/dev/null || true

      - name: Full historical Phase 11 closure
        run: just guard-cranelift-phase11-close

  final:
    name: final diff check
    runs-on: ubuntu-latest
    needs: [guard, phase11-family, historical-closure]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Diff check
        run: git diff --check
