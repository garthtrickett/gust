      - name: Phase 19 brand identity and value representation closure
        run: just guard-cranelift-phase19-close

      - name: Phase 17 cross-feature runtime composition
        run: just guard-cranelift-phase17-composition-contract

  guard:
    name: guard / ${{ matrix.shard }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: build

    strategy:
      fail-fast: false
      matrix:
        shard:
          - mir-to-c-return-int
          - routed-return-int

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install guard tools
        run: |
          bash scripts/install-native-deps-ci.sh build-essential curl ripgrep
          bash scripts/install-just-ci.sh "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Download Gust build outputs
        uses: actions/download-artifact@v4
        with:
          name: gust-build
          path: .

      - name: Restore executable bit
        run: chmod +x ./gust 2>/dev/null || true

      - name: Run PR fast shard
        run: just guard-pr-fast-shard "${{ matrix.shard }}"

  phase11-family:
    name: Phase 11 family / ${{ matrix.family }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: build
    strategy:
      fail-fast: false
      matrix:
        family: ${{ fromJSON(needs.build.outputs.phase11_families) }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install guard tools
        run: |
          bash scripts/install-native-deps-ci.sh build-essential curl ripgrep
          bash scripts/install-just-ci.sh "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Download Gust build outputs
        uses: actions/download-artifact@v4
        with:
          name: gust-build
          path: .

      - name: Restore executable bit
        run: chmod +x ./gust 2>/dev/null || true

      - name: Run Level 2 differential family
        run: just guard-cranelift-differential-family "${{ matrix.family }}"

  phase20-nested-brand-annotation:
    name: Phase 20 nested brand annotation parity
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: build

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install guard tools
        run: |
          bash scripts/install-native-deps-ci.sh build-essential curl ripgrep
          bash scripts/install-just-ci.sh "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Download Gust build outputs
        uses: actions/download-artifact@v4
        with:
          name: gust-build
          path: .

      - name: Restore executable bit
        run: chmod +x ./gust 2>/dev/null || true

      - name: Phase 20 nested brand annotation parity
        run: just guard-cranelift-phase20-nested-brand-annotation-parity

      - name: Phase 20 exact branded boundary parity
        run: just guard-cranelift-phase20-exact-brand-boundary-parity

      - name: Phase 20 contextual generic constructor parity
        run: just guard-cranelift-phase20-contextual-generic-constructor-parity

      - name: Phase 20 Arena.Free receiver invalidation parity
        run: just guard-cranelift-phase20-arena-free-parity

      - name: Phase 20 whole-program initial corpus parity
        run: just guard-cranelift-phase20-whole-program-corpus-parity

      - name: Phase 20 stdlib and runtime component differential
        run: just guard-cranelift-phase20-stdlib-runtime-parity

      - name: Phase 20 deterministic generated-MIR samples
        run: just guard-cranelift-phase20-generated-mir-sample-parity

      - name: Phase 20 generic guard prerequisites parity
        run: just guard-cranelift-phase20-generic-guard-prerequisites-parity

      - name: Phase 20 inert resource-rooted access authority parity
        run: just guard-cranelift-phase20-resource-rooted-access-parity

      - name: Phase 20 explicit-unsafe Mutex primitive migration parity
        run: just guard-cranelift-phase20-unsafe-mutex-migration-parity

      - name: Phase 20 protected-access liveness enforcement parity
        run: just guard-cranelift-phase20-protected-access-liveness-parity

      - name: Phase 20 long-lived and concurrent resource smoke
        run: just guard-cranelift-phase20-long-lived-concurrent-smoke

      - name: Phase 20 mixed cross-feature qualification
        run: just guard-cranelift-phase20-cross-feature-qualification-parity

  final:
    name: final diff check
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: [guard, level1, phase11-family, phase20-nested-brand-annotation]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Diff check
        run: git diff --check
