name: Cranelift Phase 16 Cross-Module ABI
on:
  pull_request:
    paths: ['compiler/mir_cross_module_abi.gst','compiler/mir_cross_module_abi_mir_to_c.gst','compiler/mir_native_backend_cross_module_abi_request.gst','compiler/mir_cross_module_abi_smoke_test_entry.gst','compiler/experiments/cranelift/src/cross_module_abi.rs','compiler/experiments/cranelift/src/main.rs','scripts/phase16_cross_module_abi.py','scripts/phase16_cross_module_abi_parity.sh','scripts/cranelift_test_levels.json','tests/cranelift/phase16_cross_module_abi_contract.tsv','tests/cranelift/phase16_cross_module_abi_review.txt','justfile','.github/workflows/phase16-cross-module-abi.yml']
  push:
    branches: [main]
    paths: ['compiler/mir_cross_module_abi.gst','compiler/mir_cross_module_abi_mir_to_c.gst','compiler/mir_native_backend_cross_module_abi_request.gst','compiler/mir_cross_module_abi_smoke_test_entry.gst','compiler/experiments/cranelift/src/cross_module_abi.rs','compiler/experiments/cranelift/src/main.rs','scripts/phase16_cross_module_abi.py','scripts/phase16_cross_module_abi_parity.sh','scripts/cranelift_test_levels.json','tests/cranelift/phase16_cross_module_abi_contract.tsv','tests/cranelift/phase16_cross_module_abi_review.txt','justfile','.github/workflows/phase16-cross-module-abi.yml']
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/install-just-ci.sh "$HOME/.local/bin" && echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - run: just guard-cranelift-phase16-cross-module-abi-contract
  parity:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Cache cargo registry and build outputs
        uses: actions/cache@v4
        with:
          # Only cargo target dirs and the registry. Never build/guards itself:
          # those dirs hold witnesses, mutation requests, and .output sentinels,
          # and restoring stale ones could manufacture a false pass.
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            compiler/experiments/cranelift/target
            build/guards/*/cargo-target
          key: cargo-${{ runner.os }}-${{ github.workflow }}-${{ hashFiles('compiler/experiments/cranelift/Cargo.lock') }}
          restore-keys: |
            cargo-${{ runner.os }}-${{ github.workflow }}-
      - run: bash scripts/install-native-deps-ci.sh build-essential curl ripgrep
      - run: bash scripts/install-just-ci.sh "$HOME/.local/bin" && echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - run: just guard-cranelift-phase16-cross-module-abi-parity
