name: Cranelift Phase 17 Runtime Authority

on:
  pull_request:
    paths:
      - 'compiler/mir_runtime_boundary_authority.gst'
      - 'compiler/mir_native_backend_runtime_request.gst'
      - 'compiler/mir_runtime_boundary_authority_smoke_test_entry.gst'
      - 'compiler/mir_to_c.gst'
      - 'compiler/driver.gst'
      - 'compiler/experiments/cranelift/src/main.rs'
      - 'compiler/**/*diagnostic*'
      - 'scripts/cranelift_feature_registry.json'
      - 'scripts/cranelift_feature_registry.schema.json'
      - 'scripts/cranelift_registry.py'
      - 'scripts/phase17_runtime_authority.py'
      - 'scripts/guard-cranelift-phase17-runtime-authority-contract.sh'
      - 'tests/cranelift/phase17_runtime_authority_contract.tsv'
      - 'tests/cranelift/phase17_runtime_authority_review.txt'
      - '.github/workflows/phase17-runtime-authority.yml'
      - 'TASK.md'
  push:
    branches: [main]
    paths:
      - 'compiler/mir_runtime_boundary_authority.gst'
      - 'compiler/mir_native_backend_runtime_request.gst'
      - 'compiler/mir_runtime_boundary_authority_smoke_test_entry.gst'
      - 'scripts/cranelift_feature_registry.json'
      - 'scripts/cranelift_feature_registry.schema.json'
      - 'scripts/cranelift_registry.py'
      - 'scripts/phase17_runtime_authority.py'
      - 'scripts/guard-cranelift-phase17-runtime-authority-contract.sh'
      - 'tests/cranelift/phase17_runtime_authority_contract.tsv'
      - 'tests/cranelift/phase17_runtime_authority_review.txt'

jobs:
  guard-cranelift-phase17-runtime-authority-contract:
    name: Phase 17.1 runtime authority contract (Level 1)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: guard-cranelift-phase17-runtime-authority-contract
        run: python3 scripts/phase17_runtime_authority.py --check
