name: Cranelift Phase 16 Aggregate Returns

on:
  pull_request:
    paths:
      - 'compiler/mir_aggregate_result_abi.gst'
      - 'compiler/mir_aggregate_result_abi_mir_to_c.gst'
      - 'compiler/mir_native_backend_aggregate_result_request.gst'
      - 'compiler/mir_aggregate_result_abi_smoke_test_entry.gst'
      - 'compiler/experiments/cranelift/src/aggregate_result_abi.rs'
      - 'compiler/experiments/cranelift/src/main.rs'
      - 'scripts/phase16_aggregate_result.py'
      - 'scripts/phase16_aggregate_result_parity.sh'
      - 'scripts/cranelift_test_levels.json'
      - 'tests/cranelift/phase16_aggregate_result_contract.tsv'
      - 'tests/cranelift/phase16_aggregate_result_review.txt'
      - 'justfile'
      - '.github/workflows/phase16-aggregate-returns.yml'
  push:
    branches: [main]
    paths:
      - 'compiler/mir_aggregate_result_abi.gst'
      - 'compiler/mir_aggregate_result_abi_mir_to_c.gst'
      - 'compiler/mir_native_backend_aggregate_result_request.gst'
      - 'compiler/mir_aggregate_result_abi_smoke_test_entry.gst'
      - 'compiler/experiments/cranelift/src/aggregate_result_abi.rs'
      - 'compiler/experiments/cranelift/src/main.rs'
      - 'scripts/phase16_aggregate_result.py'
      - 'scripts/phase16_aggregate_result_parity.sh'
      - 'scripts/cranelift_test_levels.json'
      - 'tests/cranelift/phase16_aggregate_result_contract.tsv'
      - 'tests/cranelift/phase16_aggregate_result_review.txt'
      - 'justfile'
      - '.github/workflows/phase16-aggregate-returns.yml'
  workflow_dispatch:

jobs:
  aggregate-return-contract:
    name: Phase 16.4 aggregate return contract (Level 1)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned just
        run: |
          bash scripts/install-just-ci.sh "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - run: just guard-cranelift-phase16-aggregate-return-contract

  aggregate-return-parity:
    name: Phase 16.4 aggregate return parity (Level 2)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Cache cargo registry and build outputs
        uses: actions/cache@v4
        with:
          # Only cargo target dirs and the registry. Never build/guards itself:
          # those dirs hold witnesses, mutation requests, and .output sentinels,
          # and restoring stale ones could manufacture a false pass.
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            compiler/experiments/cranelift/target
            build/guards/*/cargo-target
          key: cargo-${{ runner.os }}-${{ github.workflow }}-${{ hashFiles('compiler/experiments/cranelift/Cargo.lock') }}
          restore-keys: |
            cargo-${{ runner.os }}-${{ github.workflow }}-
      - name: Install native dependencies
        run: bash scripts/install-native-deps-ci.sh build-essential curl ripgrep
      - name: Install pinned just
        run: |
          bash scripts/install-just-ci.sh "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - run: just guard-cranelift-phase16-aggregate-return-parity
      - name: Upload Phase 16.4 diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase16-aggregate-result-diagnostics
          if-no-files-found: ignore
          path: |
            to.log
            build/gust-build.log
            build/mir_aggregate_result_abi_smoke_test_entry.compile.log
            build/guards/phase16_aggregate_result/
